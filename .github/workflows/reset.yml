name: reset (clean slate)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'ОБХВАТ. nishto = не се пипа нищо (по подразбиране)'
        default: 'nishto'
        type: choice
        options: [nishto, channel, group, all]
      potvarzhdavam:
        description: 'ЗА ИСТИНСКО ТРИЕНЕ напиши ТОЧНО: IZTRII VSICHKO   (празно = сух режим: само брои, не трие)'
        required: false
        default: ''
      tavan:
        description: 'ТАВАН: най-много изтрити за ЕДНО пускане (каналът и групата делят този брой)'
        required: false
        default: '500'

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean slate
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID }}
          # 🔴 РЕЗЕРВАТА Е ЗАДЪЛЖИТЕЛНА (01.09.2026). Незададена GitHub
          # променлива пристига като ПРАЗЕН НИЗ, а скриптът чете
          # .get("CHANNEL_ID", "-1004403334702") — стандартът в .get СЕ
          # ПОЛЗВА само при ЛИПСВАЩ ключ, не при празен. Тоест празният
          # низ бие канала и ботът пише в никъде.
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          RESET_MODE: ${{ github.event.inputs.mode }}
          # 🔴 КЛЮЧАЛКАТА (01.09.2026). Дотук ДВЕ кликвания изтриваха канала
          # И групата: падащото меню стоеше на 'all', а reset.py нямаше нито
          # една самопроверка. Изтрито съобщение в Telegram НЕ СЕ ВРЪЩА.
          # Сега: 'nishto' по подразбиране, а без ТОЧНАТА фраза скриптът
          # само брои и печата какво БИ изтрил.
          RESET_POTVARZHDAVAM: ${{ github.event.inputs.potvarzhdavam }}
          RESET_TAVAN: ${{ github.event.inputs.tavan }}
        run: python reset.py

      # Ключалка без проверка е украса. Този ред пуска 60-те самопроверки
      # СЛЕД всяко нулиране - и при провал рънът почервенява.
      - name: Samoproverka na klyuchalkata
        if: always()
        run: python reset.py --selftest

name: scorer (резултатите на бота)

# ─────────────────────────────────────────────────────────────────────────────
# ЗАТВАРЯ КРЪГА. Предсказателят твърди, оценителят проверява.
#
#   стая 9  „Резултати и статистика" — ЧИСЛАТА: пълният отчет (познати И
#                                      сгрешени, процент за деня и общо) плюс
#                                      равносметката за целия ден
#   стая 10 „Печеливши фишове"       — ФИШОВЕТЕ: кой е минал, кой се е скъсал
#                                      и на кой крак
#
# 🔴 ТАЗИ ГЛАВА ЛЪЖЕШЕ ДО 11.08.2026: пишеше „стая 10 — само познатите,
# витрина", тоест точно обратното на това, което кодът прави от 11.08 насам, и
# точно смесването, което собственикът забрани с думите „да не объркваш
# нещата". Оставена така, тя е капанът, по който следващият, който я прочете
# като истина, ще „поправи" кода назад.
#
# ЗАЩО СЪЩЕСТВУВА
# Дотук ботът пускаше прогнози и никой никога не проверяваше дали е познал.
# Стая 9 показваше случайни резултати от чужди първенства, стая 10 стоеше
# празна. „Показваме и загубите" без нито едно показано число не е прозрачност,
# а лозунг.
#
# ЧАСОВЕТЕ (GitHub cron е ВИНАГИ UTC; България е UTC+3 лятото)
#   06:00 UTC = 09:00 BG — нощните мачове (НБА, НХЛ, ММА) вече са свършили
#   17:00 UTC = 20:00 BG — дневните европейски и азиатските са готови
# Мач, който още не е завършил, просто остава неоценен и се проверява пак утре.
# Затова две пускания стигат: нищо не се губи, само чака реда си.
#
# ЖЕЛЕЗНО: пише САМО в стаи 9 и 10 (и в канала, по поръчка от 05.08.2026).
# Всяка друга стая се отказва в самия скрипт, преди мрежата. Стая 4 е на
# човека-типстер и от 11.08 вече не е между разрешените.
# Загубите не се крият и не се трият.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # ЧАСОВЕТЕ СА ПО ИЗРИЧНА ПОРЪЧКА НА СОБСТВЕНИКА (05.08.2026):
    #   „Искам резултатите един път в 14:00 и втори път в 23:00."
    #
    # 14:00 — нощните и сутрешните мачове вече са свършили.
    # 23:00 — КРАЯТ НА ДЕНЯ: дневните и вечерните са изиграни, тоест обзорът
    #         покрива целия ден. Това е единственият крон, който минава след
    #         22:00 — и е нарочно: обзорът НЕ Е прогноза, той идва СЛЕД мачовете.
    #         Прогнозите си остават до 20:00.
    # 🔴 ПОЛОВИН ЧАС СЛЕД ПРЕДСКАЗАТЕЛЯ, НЕ ЕДНОВРЕМЕННО С НЕГО.
    #
    # ДЕФЕКТ, НАМЕРЕН НА ЖИВО (06.08.2026): и двата крона бяха на кръгъл час,
    # същия като на predict.yml. Резултатът в дневника на GitHub:
    #     scorer     23:30:11Z  ПРОВАЛ
    #     predictor  23:31:18Z  успех
    # Двата бота пишат ЕДИН И СЪЩ файл — predict_log.json. Предсказателят
    # добавя новите прогнози, оценителят вдига „scored" на старите. Тръгнат ли
    # заедно, единият push се отхвърля, петте опита се изчерпват и рънът пада
    # ЧЕРВЕН — а отсъдените мачове се губят и се смятат наново на другия ден.
    #
    # Тридесет минути закъснение стигат: предсказателят приключва за 1-3 минути.
    #
    # 🔴 11.08.2026: кронът е план, не час. Измерено върху 55 разписани пускания
    # на предсказателя — средно закъснение 65 минути, 34 от 55 над час. Затова
    # и двата слизат с час: планиран 13:30 БГ излиза около 14:30, планиран 22:30
    # излиза около 23:30. Собственикът иска резултати в 14:00 и в 23:00 —
    # това е най-близкото, което разписание на GitHub може да обещае честно.
    - cron: '30 10 * * *'   # 13:30 BG планиран → ~14:30 реален
    - cron: '30 19 * * *'   # 22:30 BG планиран → ~23:30 реален, целият обзор
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Сухо пускане — отчетът се печата в лога, нищо не заминава'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # 🔴 СЪЩАТА ГРУПА КАТО predict.yml — двата пишат predict_log.json.
  # Виж обяснението там: 5 засичания за 7 дни, най-остро 13 секунди.
  group: greenpicks-state
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔴 ДОБАВЕНО 12.08.2026. checkout@v4 сваля github.sha — върха от мига, в
      # който рънът е СЪЗДАДЕН, не когато е тръгнал. Concurrency групата държи
      # рънове да чакат; измерено върху 424 ръна, 39 (9.2%) са създадени,
      # докато друг от групата върви. Тоест работният файл може да е отпреди
      # чуждото писане — и state-ът се презаписва със стар.
      - name: Дръпни последното (checkout-ът може да е застоял)
        run: git pull --ff-only origin ${{ github.ref_name }} || echo "не превъртя чисто — карам с това, което имам"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Портиерът: счупен ли е пазачът на стаите или отсъждането, спираме ТУК.
      # По-добре никакъв отчет, отколкото отчет, който брои грешно.
      - name: Самопроверка на оценителя
        run: python scorer.py --selftest

      - name: Оцени и отчети
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          RESULTS_THREAD_ID: ${{ vars.RESULTS_THREAD_ID || '9' }}
          # 🔴 ЛИПСВАШЕ (11.08.2026). scorer.py ред 729 гради адреса на
          # TheSportsDB от този ключ; без него пада на тест-ключа "123", който
          # връща 1-3 записа вместо целия ден. Точно през тази врата минават
          # прогнозите БЕЗ slug (WNBA: 22 такива, нула отсъдени, докато
          # вратата съществуваше). daily/matches/predict го подават отдавна —
          # само оценителят, който най-много го ползва, не го получаваше.
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY || vars.SPORTSDB_KEY }}
          WINS_THREAD_ID: ${{ vars.WINS_THREAD_ID || '10' }}
          SCORE_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python scorer.py

      # Дневникът пази кои твърдения вече са отсъдени. Без връщане в
      # хранилището същият мач би се отчитал всеки ден наново.
      - name: Запази дневника
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "greenpicks-bot"
          git config user.email "bot@greenpicks"
          git add predict_log.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Дневникът е без промяна."
            exit 0
          fi
          git commit -m "scorer: отсъдени прогнози"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then
              pushed=1
              break
            fi
            echo "Push-ът не мина (опит $i) — дърпам и опитвам пак."
            git pull --rebase --autostash || git rebase --abort || true
            sleep $((RANDOM % 6 + 3))
          done
          if [ "$pushed" != "1" ]; then
            echo "ЧЕРВЕНО: дневникът НЕ се върна — утре същите мачове ще се отчетат пак."
            exit 1
          fi
          echo "Дневникът е запазен."

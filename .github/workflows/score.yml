name: scorer (резултатите на бота)

# ─────────────────────────────────────────────────────────────────────────────
# ЗАТВАРЯ КРЪГА. Предсказателят твърди, оценителят проверява.
#
#   стая 9  „Резултати и статистика" — пълният отчет: познати И сгрешени,
#                                      процент за деня и процент общо
#   стая 10 „Печеливши фишове"       — само познатите, витрина
#
# ЗАЩО СЪЩЕСТВУВА
# Дотук ботът пускаше прогнози и никой никога не проверяваше дали е познал.
# Стая 9 показваше случайни резултати от чужди първенства, стая 10 стоеше
# празна. „Показваме и загубите" без нито едно показано число не е прозрачност,
# а лозунг.
#
# ЧАСОВЕТЕ (GitHub cron е ВИНАГИ UTC; България е UTC+3 лятото)
#   06:00 UTC = 09:00 BG — нощните мачове (НБА, НХЛ, ММА) вече са свършили
#   17:00 UTC = 20:00 BG — дневните европейски и азиатските са готови
# Мач, който още не е завършил, просто остава неоценен и се проверява пак утре.
# Затова две пускания стигат: нищо не се губи, само чака реда си.
#
# ЖЕЛЕЗНО: пише САМО в стаи 9 и 10. Всяка друга се отказва в самия скрипт,
# преди мрежата. Загубите не се крият и не се трият.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 6 * * *'     # 09:00 BG — след нощните мачове
    - cron: '0 17 * * *'    # 20:00 BG — след дневните
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Сухо пускане — отчетът се печата в лога, нищо не заминава'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scorer-bot
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Портиерът: счупен ли е пазачът на стаите или отсъждането, спираме ТУК.
      # По-добре никакъв отчет, отколкото отчет, който брои грешно.
      - name: Самопроверка на оценителя
        run: python scorer.py --selftest

      - name: Оцени и отчети
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          RESULTS_THREAD_ID: ${{ vars.RESULTS_THREAD_ID || '9' }}
          WINS_THREAD_ID: ${{ vars.WINS_THREAD_ID || '10' }}
          SCORE_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python scorer.py

      # Дневникът пази кои твърдения вече са отсъдени. Без връщане в
      # хранилището същият мач би се отчитал всеки ден наново.
      - name: Запази дневника
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "greenpicks-bot"
          git config user.email "bot@greenpicks"
          git add predict_log.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Дневникът е без промяна."
            exit 0
          fi
          git commit -m "scorer: отсъдени прогнози"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then
              pushed=1
              break
            fi
            echo "Push-ът не мина (опит $i) — дърпам и опитвам пак."
            git pull --rebase --autostash || git rebase --abort || true
            sleep $((RANDOM % 6 + 3))
          done
          if [ "$pushed" != "1" ]; then
            echo "ЧЕРВЕНО: дневникът НЕ се върна — утре същите мачове ще се отчетат пак."
            exit 1
          fi
          echo "Дневникът е запазен."

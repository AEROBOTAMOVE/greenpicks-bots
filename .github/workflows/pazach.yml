name: pazach (ПАЗАЧЪТ 🛡️)

# ═══════════════════════════════════════════════════════════════════════════
# ЗАЩО СЪЩЕСТВУВА (25.08.2026)
#
# Оценителят гърмя три пъти подред и резултатите спряха за 33 часа.
# Собственикът го откри — не системата. Здравният преглед в daily.yml през
# това време пишеше „последните 30 рънa в CI: 0 червени", защото питаше
# ОБЩИЯ списък на рънoвете, а рутерът го залива: измерено живо, последните
# 30 рънa покриват 1.8 часа.
#
# Този workflow има ЕДНА работа — да гледа дали другите живеят, и да го каже
# на ЧОВЕК. Той е единственият, чийто провал не бива да мълчи, затова тук
# НЯМА continue-on-error: гръмне ли пазачът, това се вижда като червено.
#
# ЗАЩО НА ЧАС, А НЕ НА ПОЛОВИН
# Аварията, заради която е построен, продължи 33 часа. Час забавяне е 33 пъти
# по-добре и струва 24 рънa на ден. На половин час би удвоило шума в Actions
# без да добави нищо, което да си струва: оценителят се пуска два пъти дневно.
# ═══════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '5 * * * *'          # всеки час и пет, UTC
  workflow_dispatch:

# Два пазача едновременно биха си презаписали състоянието и биха пратили
# тревогата два пъти. Един по един.
concurrency:
  group: pazach
  cancel-in-progress: false

permissions:
  contents: write
  actions: read                  # без това питането за рънoве връща 403

jobs:
  pazach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Състоянието (кога сме казали коя тревога) живее в хранилището.
      # Застоял checkout значи забравена почивка и повторена тревога.
      - name: Дръпни последното
        run: git pull --ff-only origin ${{ github.ref_name }} || echo "не превъртя чисто — карам с това, което имам"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Самопроверка на пазача
        env:
          # 🔴 СУХ РЕЖИМ ЗА САМОПРОВЕРКАТА (05.09.2026). Две проверки,
          # които искат УСПЕХ от вратата навън, счупиха рутера за два дни:
          # 400 ръна, нула успешни. Тази стъпка пуска САМО самопроверка —
          # тя няма право да праща нищо, каквото и да реши следващият автор.
          PAZACH_DRY_RUN: '1'
        run: python pazach.py --selftest

      # Изход 1 значи „намерих проблем" — това е РАБОТАТА му, не повреда.
      # Затова изходът се гълта тук, а истинската повреда (гръмнал Python)
      # пак ще излезе червена, защото тя не дава изход 1, а трасе.
      - name: Обход
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ vars.ADMIN_CHAT_ID }}
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          # 🔴 БЕЗ ТОЗИ ТОКЕН ПАЗАЧЪТ Е СЛЯП. Неподписаното питане към GitHub
          # е 60 заявки на час за целия рънър; шест workflow-а на час минават,
          # но при най-лекото съседство се удря 403 „rate limit exceeded".
          # Проверено живо на 25.08: без токен всичките шест питания върнаха
          # 403. Пазачът тогава честно каза „не мога да проверя" — но честна
          # слепота пак е слепота.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── РЪЧКИТЕ НА PAZACH (02.09.2026). Одит намери 127
          # мъртви ръчки в проекта. Тези бяха мои: обявих ги за
          # лостове в доклад, а нито един работен файл не ги
          # подаваше — значи не работеха.
          # гратис в минути за кроновите workflow-и
          PAZACH_GRATIS_KRON: ${{ vars.PAZACH_GRATIS_KRON || '700' }}
          # гратис в минути за външно будените
          PAZACH_GRATIS: ${{ vars.PAZACH_GRATIS || '100' }}
          # колко часа тишина се търпят, преди да се вика
          PAZACH_TISHINA: ${{ vars.PAZACH_TISHINA }}
          # колко поредни провала пали тревога
          PAZACH_POREDNI: ${{ vars.PAZACH_POREDNI }}
        run: |
          python pazach.py || true

      - name: Запази състоянието
        run: |
          git config user.name "greenpicks-bot"
          git config user.email "bot@greenpicks"
          # Един по един: `git add a b nyama.json` не добавя НИЩО, щом един
          # файл липсва — git отхвърля целия pathspec (проверено 12.08.2026).
          for f in pazach_state.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "нищо ново за пазене"
            exit 0
          fi
          git commit -m "pazach state"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then pushed=1; break; fi
            git pull --rebase origin ${{ github.ref_name }} || true
          done
          if [ "$pushed" != "1" ]; then
            echo "не успях да върна състоянието — тревогата може да се повтори"
            exit 1
          fi

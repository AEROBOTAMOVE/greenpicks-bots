name: support (ПОДКРЕПА 🆘)

# ─────────────────────────────────────────────────────────────────────────────
# Пощата на съпорта. В закачените постове от месеци пише "Пиши на екипа" —
# този workflow прави обещанието вярно.
#
# КОЙ БОТ ОТГОВАРЯ. Скриптът избира сам, в този ред:
#   1. SUPPORT_BOT_TOKEN — отделният бот (@greenpicks_support_bot), ако някога
#      бъде добавен в Secrets. Не е задължителен.
#   2. BOT_TOKEN — главният бот (@green_picks_info_bot). Той ВЕЧЕ работи и е
#      админ в групата и в канала, значи съпортът тръгва ВЕДНАГА. Хората му
#      пишат лично точно както на всеки друг бот.
# И двете се подават по-долу; втората може да е празна — скриптът се оправя сам
# и печата в лога КОЯ променлива ползва (стойност на токен не се печата никога).
#
# ⚠️ ДЕЛИ ОПАШКАТА С router-bot. При споделен BOT_TOKEN два процеса четат едно
# и също getUpdates. Потвърждаването в Telegram е ГЛОБАЛНО: offset=N трие
# ВСИЧКИ ъпдейти под N, независимо чии са. Затова двата скрипта са направени
# да се изчакват: всеки спира пред първия чужд ъпдейт и НЕ го маркира
# (support пред channel_post, router пред message). Проверено със симулация на
# преплетена опашка: 10 от 10 ъпдейта стигат до собственика си. Преди фикса
# рутерът изяждаше 5 от 5 въпроса, безшумно.
# Затова и часовете са РАЗМИНАТИ: рутерът е на :00/:10/:20..., съпортът на
# :07/:22/:37/:52. Засекат ли се все пак, Telegram връща 409 — скриптът
# пропуска минаването, offset-ът не мърда и нищо не се губи.
# Изключване на обхождането (например ако някога дойде webhook): SUPPORT_POLLING=0.
#
# ЧЕСТНО ЗА ЗАБАВЯНЕТО: GitHub cron НЕ е точен. При натоварване рънът закъснява
# 10-30 мин, а понякога се ПРОПУСКА. Затова честите въпроси НЕ минават през
# този крон — те се отговарят от бутоните и командите, които клиентът на
# Telegram рисува сам, мигновено. Никъде не обещаваме срок за отговор от човек.
#
# ЗА 60-те ДНИ: GitHub спира разписанията след 60 дни без активност в хранилището.
# Постоянните комити на паметта го държат будно, но ако Actions някога млъкнат,
# опашката на Telegram пази въпросите само 24 часа.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # на всеки 15 мин, разминато с router-bot
  workflow_dispatch:
    inputs:
      mode:
        description: 'poll = чети пощата · setup = ЕДНОКРАТНО описание и меню (иска СВОЙ токен) · dry = само печата · selftest = само проверки'
        type: choice
        default: 'poll'
        options: [poll, setup, dry, selftest]

permissions:
  contents: write

concurrency:
  # Същата група като рутера и предсказателя — двамата пишат support_state.json
  # и се засичаха 39 пъти за 7 дни (измерено 11.08.2026).
  group: greenpicks-state
  cancel-in-progress: false     # никога не убивай рън по средата на отговор

jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # 🔴 ДОБАВЕНО 12.08.2026. checkout@v4 сваля github.sha — върха от мига, в
      # който рънът е СЪЗДАДЕН, не когато е тръгнал. Concurrency групата държи
      # рънове да чакат; измерено върху 424 ръна, 39 (9.2%) са създадени,
      # докато друг от групата върви. Тоест работният файл може да е отпреди
      # чуждото писане — и state-ът се презаписва със стар.
      - name: Дръпни последното (checkout-ът може да е застоял)
        run: git pull --ff-only origin ${{ github.ref_name }} || echo "не превъртя чисто — карам с това, което имам"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Определи режима
        id: m
        run: echo "mode=${{ github.event.inputs.mode || 'poll' }}" >> $GITHUB_OUTPUT

      # Портиерът. Ако пазачът на стаите, изборът на токен, съвместното
      # обхождане или екранирането на HTML са счупени, спираме ТУК — по-добре
      # мълчание, отколкото бот, който пише в чужда стая, трие чужда поща или
      # изсипва токен в лога. Тече БЕЗ никакви тайни в средата.
      - name: Самопроверка на съпорта
        run: python support_bot.py selftest

      # ЕДНОКРАТНО, на ръка, и САМО със свой токен. Тези извиквания преписват
      # описанието, менюто и командите на бота — върху главния бот това би
      # изтрило чужда витрина, затова скриптът сам се отказва.
      - name: Еднократна настройка на бота
        if: ${{ steps.m.outputs.mode == 'setup' }}
        env:
          SUPPORT_BOT_TOKEN: ${{ secrets.SUPPORT_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPPORT_FAQ_URL: ${{ vars.SUPPORT_FAQ_URL }}
        run: python support_bot.py setup

      - name: Прочети пощата
        if: ${{ steps.m.outputs.mode != 'setup' && steps.m.outputs.mode != 'selftest' }}
        env:
          # И ДВАТА. Първият може изобщо да го няма в Secrets — тогава скриптът
          # пада на втория и съпортът работи през главния бот.
          SUPPORT_BOT_TOKEN: ${{ secrets.SUPPORT_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # ⚠️ 0 ПО ПОДРАЗБИРАНЕ ОТ 29.07.2026 — И ТОВА Е ВЯРНОТО.
          # Опашката на Telegram е ЕДНА на бот. Докато тук стоеше 1, два рънъра
          # четяха една опашка и си отстъпваха учтиво: рутерът спираше пред
          # първото лично съобщение, съпортът — пред първия пост от канала.
          # На хартия работи. На живо опашката ЗАПОЧВА с пост от канала, значи
          # съпортът засядаше на първата стъпка: рутерът беше стигнал ъпдейт
          # 320389746, съпортът стоеше на 0 с нула обработени — а човек беше
          # писал „/start" в 18:00 и не получи нищо.
          # Сега пощата се чете САМО от router.yml (на 10 мин), който подава
          # личните съобщения на същите функции на съпорта. Тук остават
          # самопроверката и еднократната настройка.
          # Върни го на 1 само ако рутерът бъде спрян.
          SUPPORT_POLLING: ${{ vars.SUPPORT_POLLING || '0' }}
          # Резервните стойности НЕ са излишни: незададена променлива в GitHub
          # идва като празен низ, а празният низ бие подразбиращото се в скрипта.
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          # Стаята на съпорта. Валидира се В СКРИПТА срещу белия списък: забранена
          # или безсмислена стойност пада на 11 с WARN, никога не отваря стая 4.
          # HELP_THREAD_ID е старото име и още работи, ако някъде е останало.
          SUPPORT_THREAD_ID: ${{ vars.SUPPORT_THREAD_ID || '11' }}
          HELP_THREAD_ID: ${{ vars.HELP_THREAD_ID || '11' }}
          # По избор: лична админ-група. Зададена ли е, въпросите отиват ТАМ,
          # а не в публичната стая 11 — по-добре за личните въпроси.
          ADMIN_CHAT_ID: ${{ vars.ADMIN_CHAT_ID }}
          # Числовите id-та, на които е позволено да отговарят. БЕЗ тях релето
          # е изключено — това е нарочно, за да не отговаря случаен човек от името на екипа.
          SUPPORT_ADMIN_IDS: ${{ vars.SUPPORT_ADMIN_IDS }}
          # НАРОЧНО без резервна стойност: празно = скриптът сам казва кой бот
          # наистина отговаря в момента. Твърдо изписан handle тук може да
          # излъже хората, ако токенът е другият.
          SUPPORT: ${{ vars.SUPPORT }}
          SUPPORT_FAQ_URL: ${{ vars.SUPPORT_FAQ_URL }}
          SUPPORT_MAX_FORWARDS: ${{ vars.SUPPORT_MAX_FORWARDS }}
          SUPPORT_MAX_PER_USER: ${{ vars.SUPPORT_MAX_PER_USER }}
          SUPPORT_DRY_RUN: ${{ steps.m.outputs.mode == 'dry' && '1' || '0' }}
        run: python support_bot.py

      # Паметта се връща в хранилището. При "dry" няма какво да се пази.
      # ══════════════════════════════════════════════════════════════
      #  ⏰ ВТОРИ НЕЗАВИСИМ БУДИЛНИК (12.08.2026)
      #
      #  Първият виси на рутера. Но измереното е сурово: разписанието му е
      #  */10, а GitHub дава 6.5 пускания на ден, медианна пауза 74 минути.
      #  Един спусък върху ненадежден часовник е пак ненадежден часовник.
      #
      #  Съпортът е ОТДЕЛЕН крон (7,22,37,52) и отделна опашка от рънове —
      #  тръгне ли той, а рутерът не, предсказателят пак се събужда. Двата са
      #  в СЪЩАТА concurrency група, значи не се блъскат, а спирачката в
      #  budilnik.py (30 мин + budilnik_state.json) пази от двойно будене.
      #  Дубли няма и от втората страна: предсказателят помни какво е пуснал.
      - name: Проспа ли предсказателя
        id: budilnik
        run: python budilnik.py

      - name: Модулът за тениса на маса
        if: steps.budilnik.outputs.budim == '1'
        run: python -m pip install --quiet --disable-pip-version-check brotli

      - name: Портиерът на предсказателя
        if: steps.budilnik.outputs.budim == '1'
        env:
          # 🔴 СУХ РЕЖИМ ЗА САМОПРОВЕРКАТА (05.09.2026). Две проверки,
          # които искат УСПЕХ от вратата навън, счупиха рутера за два дни:
          # 400 ръна, нула успешни. Тази стъпка пуска САМО самопроверка —
          # тя няма право да праща нищо, каквото и да реши следващият автор.
          PREDICT_DRY_RUN: '1'
        run: python predictor.py selftest

      - name: Събуди предсказателя
        if: steps.budilnik.outputs.budim == '1'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # Резервните стойности НЕ са излишни: незададена променлива в GitHub
          # идва като празен низ и празният низ бие подразбиращото се в скрипта.
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          PREDICT_THREAD_ID: '27'
          # Незадължителни ключове — ако ги няма, идват празни и ботът кара
          # с TheSportsDB тест-ключа. Нищо не се чупи.
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY || vars.SPORTSDB_KEY }}
          # Настройки на модела — празна стойност = вътрешната подразбираща се.
          MAX_PICKS: ${{ vars.MAX_PICKS }}
          PREDICT_POOL: ${{ vars.PREDICT_POOL || '60' }}
          PREDICT_PER_SPORT: ${{ vars.PREDICT_PER_SPORT }}
          PREDICT_MIN_STRENGTH: ${{ vars.PREDICT_MIN_STRENGTH }}
          # 🔴 ОТКОВАНО 11.08.2026. Тук стоеше твърдо '18'. Списъкът в кода
          # порасна на 21: добавени бяха квалификациите за Лига Европа и за
          # Лигата на конференциите. Измерено на живо същия ден — на 13 август
          # тези два адреса дават 12 и 25 мача, а основните им (без _qual) са
          # празни през целия август. Числото 18 щеше да отреже точно тях.
          # Празна стойност = кодът пита ЦЕЛИЯ списък, какъвто и да стане утре.
          PREDICT_FOOT_SLUGS: ${{ vars.PREDICT_FOOT_SLUGS }}
          # 🔴 ДОБАВЕНО 11.08.2026. matches.yml подава COMBAT_THREAD_ID от vars,
          # а predict.yml не го подаваше — а двата бота четат СЪЩАТА променлива.
          # Смени ли се, боевете отиват в новата стая, а ММА-картите остават в
          # 328: две стаи, нито един ред грешка в лога.
          COMBAT_THREAD_ID: ${{ vars.COMBAT_THREAD_ID || '328' }}
          # 🔴 БЛИЗНАКЪТ НА ВЕЧЕ ОПРАВЕНИЯ COMBAT_THREAD_ID (11.08.2026).
          # Тези пет номера се четат от predictor.py, matches_bot.py И
          # router_bot.py — и не идваха от НИТО ЕДИН workflow. Живееха на
          # заковани резерви 5/6/7/8/4. Смени ли се стая, трите бота щяха да
          # пишат в старата без нито един ред грешка. Точно сценарият, който
          # коментарът за бойните спортове описва — само че на пет места.
          FOOTBALL_THREAD_ID: ${{ vars.FOOTBALL_THREAD_ID || '5' }}
          BASKET_THREAD_ID: ${{ vars.BASKET_THREAD_ID || '6' }}
          TT_THREAD_ID: ${{ vars.TT_THREAD_ID || '7' }}
          VOLLEY_THREAD_ID: ${{ vars.VOLLEY_THREAD_ID || '8' }}
          PICKS_THREAD_ID: ${{ vars.PICKS_THREAD_ID || '4' }}
          # Квота за спорт: 1 = всеки спорт с кандидат получава поне една карта
          # (без нея ММА не влизаше НИКОГА — звездите му са заковани на една).
          # 0 връща старото поведение, без пипане на код.
          PREDICT_KVOTA: ${{ vars.PREDICT_KVOTA }}
          # Пазачите на разписанието (по подразбиране 10 / 30 / 10):
          #   MAX_DAY    таван прогнози за ЦЕЛИЯ ден, за да не залее стаята
          #   HORIZON_H  докъде напред гледаме — далечният мач чака своя час
          #   LEAD_MIN   колко минути преди начало спираме да пускаме карта
          PREDICT_MAX_DAY: ${{ vars.PREDICT_MAX_DAY || '80' }}
          PREDICT_HORIZON_H: ${{ vars.PREDICT_HORIZON_H }}
          PREDICT_LEAD_MIN: ${{ vars.PREDICT_LEAD_MIN }}
          # ── ПЪТИЩА НАЗАД (02.09.2026). Ръчка, която yml не
          # подава, НЕ РАБОТИ: слагаш променлива в GitHub и нищо
          # не се променя. Одит намери 127 такива; тези са
          # думите, с които се спира нещо, ако съм сбъркал.
          # =1 връща думата «коеф» в забранените (zabraneni.py, 02.09.2026)
          GREENPICKS_ZABRANI_KOEF: ${{ vars.GREENPICKS_ZABRANI_KOEF || '0' }}
          # =0 спира нормализацията на пазача и се съди по гол подниз
          GREENPICKS_PAZACH: ${{ vars.GREENPICKS_PAZACH || '1' }}
          # =0 спира ЦЯЛОТО сито: юноши, приятелски, резерви, виртуални
          PREDICT_ZALOZHIMO: ${{ vars.PREDICT_ZALOZHIMO || '1' }}
          # празно = за всички спортове; списък със запетаи го стеснява
          PREDICT_ZALOZHIMO_SPORTOVE: ${{ vars.PREDICT_ZALOZHIMO_SPORTOVE }}
          # прагът на волейболната стълбица; под него минава само с цена
          VOL_PRAG: ${{ vars.VOL_PRAG || '50' }}
          PREDICT_AMFUTBOL_LIGI: ${{ vars.PREDICT_AMFUTBOL_LIGI }}
          PREDICT_AMFUTBOL_MAX: ${{ vars.PREDICT_AMFUTBOL_MAX || '6' }}
          PREDICT_BOKS_MAX: ${{ vars.PREDICT_BOKS_MAX || '0' }}
          PREDICT_DREBEN_TT_REJI: ${{ vars.PREDICT_DREBEN_TT_REJI || '0' }}
          PREDICT_DVIZHENIE: ${{ vars.PREDICT_DVIZHENIE || '1' }}
          PREDICT_ESPORT_AKADEMII: ${{ vars.PREDICT_ESPORT_AKADEMII || '0' }}
          PREDICT_ESPORT_IGRI: ${{ vars.PREDICT_ESPORT_IGRI || 'cs2' }}
          PREDICT_ESPORT_MAX: ${{ vars.PREDICT_ESPORT_MAX || '3' }}
          PREDICT_HORIZON_AMF: ${{ vars.PREDICT_HORIZON_AMF }}
          PREDICT_HORIZON_HOK: ${{ vars.PREDICT_HORIZON_HOK }}
          PREDICT_HORIZON_MMA: ${{ vars.PREDICT_HORIZON_MMA || '96' }}
          PREDICT_HTTP_BUDGET: ${{ vars.PREDICT_HTTP_BUDGET || '520' }}
          PREDICT_ISKAM_PAZAR: ${{ vars.PREDICT_ISKAM_PAZAR || '1' }}
          PREDICT_ITF_MAX: ${{ vars.PREDICT_ITF_MAX }}
          PREDICT_IZKL: ${{ vars.PREDICT_IZKL || '' }}
          PREDICT_KOEF: ${{ vars.PREDICT_KOEF || '1' }}
          PREDICT_MAX_URGENT: ${{ vars.PREDICT_MAX_URGENT }}
          PREDICT_MMA_LIGI: ${{ vars.PREDICT_MMA_LIGI }}
          PREDICT_OSHTE: ${{ vars.PREDICT_OSHTE || '0' }}
          PREDICT_POKAZHI_CENA: ${{ vars.PREDICT_POKAZHI_CENA || '1' }}
          PREDICT_POKAZHI_IZTOCHNIK: ${{ vars.PREDICT_POKAZHI_IZTOCHNIK || '0' }}
          PREDICT_PRICHINI: ${{ vars.PREDICT_PRICHINI || '2' }}
          PREDICT_QUIET_FROM: ${{ vars.PREDICT_QUIET_FROM || '23' }}
          PREDICT_QUIET_TO: ${{ vars.PREDICT_QUIET_TO || '0' }}
          PREDICT_SAMO_S_KOEF: ${{ vars.PREDICT_SAMO_S_KOEF || '0' }}
          PREDICT_SHOW_RECORD: ${{ vars.PREDICT_SHOW_RECORD || '1' }}
          PREDICT_SMELOST_MAX: ${{ vars.PREDICT_SMELOST_MAX }}
          PREDICT_SPORTS: ${{ vars.PREDICT_SPORTS }}
          PREDICT_STAYA_REZHIM: ${{ vars.PREDICT_STAYA_REZHIM || 'pak' }}
          PREDICT_TOTAL_MAX: ${{ vars.PREDICT_TOTAL_MAX }}
          PREDICT_TOTAL_MIN: ${{ vars.PREDICT_TOTAL_MIN }}
          PREDICT_TOTAL_PAZAR: ${{ vars.PREDICT_TOTAL_PAZAR }}
          PREDICT_TTLOKAL: ${{ vars.PREDICT_TTLOKAL }}
          PREDICT_TTLOKAL_MAX: ${{ vars.PREDICT_TTLOKAL_MAX }}
          PREDICT_TTLOKAL_SCALE: ${{ vars.PREDICT_TTLOKAL_SCALE }}
          PREDICT_TT_SCALE_NISKA: ${{ vars.PREDICT_TT_SCALE_NISKA }}
          PREDICT_URGENT_LEAD_H: ${{ vars.PREDICT_URGENT_LEAD_H }}
        run: python predictor.py

      - name: Запази паметта на съпорта
        if: ${{ always() && steps.m.outputs.mode == 'poll' }}
        run: |
          git config user.name "greenpicks-bot"
          git config user.email "bot@greenpicks"
          # Съпортът вече може да буди предсказателя — значи трябва да
          # връща и НЕГОВИТЕ тефтери. Иначе будилникът мери стар час и след
          # 15 минути буди пак. Един по един: `git add a b липсващ` не добавя
          # НИЩО (проверено в истинско repo), а `|| true` крие изход 128.
          for f in support_state.json predict_state.json predict_log.json                    budilnik_state.json predict_log_arhiv.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "support state"
            ok=0
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && ok=1 && break
              sleep $((RANDOM % 7 + 3))
            done
            if [ "$ok" != "1" ]; then
              echo "::warning::Паметта на съпорта НЕ се запази. Отговорите пак няма да се дублират (offset-ът се потвърждава и от Telegram), но дневните броячи се нулират."
            fi
          else
            echo "Нищо ново в паметта."
          fi

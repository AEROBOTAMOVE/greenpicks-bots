name: predictor (БОТА ПРЕДРИЧА)

# ─────────────────────────────────────────────────────────────────────────────
# Ботът смята вероятности от статистика и ги пуска САМО в стая 27 „БОТА ПРЕДРИЧА".
# Стая 4 (човекът-типстер) и стая 26 (новини) са забранени в самия predictor.py —
# тук нищо не се пренасочва, тук само се пуска.
#
# ЗАЩО ОСЕМ ПУСКАНИЯ, А НЕ ДВЕ
# Спортът не спи. НБА и НХЛ играят между 02:00 и 06:00 българско, УЕФА е в
# 19:00-22:00, волейболът и тенисът на маса са дневни, ММА свършва към 07:00.
# Едно сутрешно пускане означава прогноза, писана 14 часа преди мача, или —
# по-лошо — изобщо никаква. На всеки три часа е честният прочит на „24/7"
# за бот, който се вдига от разписание.
#
# ЧАСОВЕТЕ (GitHub cron е ВИНАГИ UTC; България е UTC+3 лятото, UTC+2 зимата)
# Долу е лятното време. Зимата всеки ред пада с един час български.
#
#   22:00 UTC = 01:00 BG   нощта: НБА, НХЛ, главната карта на ММА
#   01:00 UTC = 04:00 BG   късната нощ: край на американските мачове
#   04:00 UTC = 07:00 BG   рано: денят се подрежда, азиатските турнири
#   07:00 UTC = 10:00 BG   сутрин: първите дневни срещи
#   10:00 UTC = 13:00 BG   обяд: волейбол и тенис на маса
#   13:00 UTC = 16:00 BG   следобед: ранният футбол
#   16:00 UTC = 19:00 BG   вечер: голямото футболно време
#   19:00 UTC = 22:00 BG   късна вечер + подписът на деня
#
# GitHub НЕ гарантира точния час — при натоварване разписаните пускания
# закъсняват с 5-20 минути. Точно затова има осем: закъсняло пускане не е
# пропуснат ден, а следващото го застига.
#
# СРЕЩУ ПОВТОРЕНИЯТА (най-важното при осем пускания)
# predictor.py държи тефтер predict_state.json: ключ на всяка пусната среща,
# закачен за ДЕНЯ НА МАЧА, не за деня на пускането. Тефтерът се записва СЛЕД
# ВСЯКА карта и се връща в repo-то от стъпката най-долу. Без този запис
# следващото пускане би повторило същите срещи — точно това, от което
# собственикът най-много се дразни.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # ═══ ВСИЧКО СВЪРШВА ДО 22:00 БГ — изрична поръчка на собственика (05.08.2026)
    #
    # Затова последният крон е в 20:00, а не в 22:00. Причината е мерена, не
    # предпазливост: GitHub НЕ пуска кроновете точно навреме. Проверено на живо —
    # крон за 07:00 БГ тръгна в 07:48. Тоест крон в 22:00 може да излезе в 22:45,
    # тоест СЛЕД границата. Двата часа запас са цената на това да не се случи.
    #
    # Махнати са и нощните пускания (01:00 и 04:00). Те публикуваха карти,
    # докато никой не гледа, а мачовете, които хващаха, се хващат и от дневните:
    # прогнозата за мач в 03:00 може спокойно да излезе в 18:00 предишния ден.
    # Пазачът на часа и без това отказва вече започнал мач.
    # 🔴 ТЕЗИ ЧАСОВЕ ТРЯБВА ДА СЪВПАДАТ С RUN_HOURS В predictor.py.
    # Там се смята кое е „следващото пускане", за да се разпознае СПЕШНИЯТ мач —
    # този, който започва преди него. Разминат ли се двата списъка, ботът ще
    # смята, че има още време, и ще изпусне мача. Пипаш единия — пипаш и другия.
    #
    # 🔴 ПРЕМЕРЕНО НАНОВО 11.08.2026 върху 107 РАЗПИСАНИ ПУСКАНИЯ на този файл:
    #     медиана 71 мин · средно 81 мин · НАЙ-ГОЛЯМО 271 МИН закъснение
    #     86% закъсняха над половин час · 64% над цял час
    #     на 06.08 излязоха само ПЕТ пускания от планираните осем
    # Тоест не просто закъснява — ПРОПУСКА. А пропуснато пускане значи стая
    # без карти цял следобед.
    #
    # Затова часовете стават ВСЕКИ ЧАС, а не през два. Не защото искаме двойно
    # повече карти — а защото при 71 минути закъснение един пропуснат час се
    # покрива от следващия. Броят карти НЕ се вдига: пази го дневният таван
    # MAX_DAY (40) в predictor.py, а всяка карта има ключ в тефтера и не може
    # да излезе два пъти (already_posted). Тоест плътността купува ТОЧНОСТ,
    # не количество.
    # 🔴 24 КРОНА ПОСТОЯННО (02.09.2026). Решение на собственика:
    # „не искам ограничения в часовете — всичко когато и да е“.
    #
    # ПРОЗОРЕЦЪТ В КОДА решава кои от тях публикуват. Вратата стои на 45
    # знака от началото на run() — ПРЕДИ да се събира каквото и да е — тоест
    # рън извън прозореца печата един ред и излиза. Нощен крон при затворен
    # прозорец струва почти нищо.
    #
    # ПЕЧАЛБАТА: денонощният режим се пали с ЕДНА променлива
    # (PREDICT_QUIET_TO=0) и се гаси със същата — без пипане на този файл.
    - cron: '0 0 * * *'     # 03:00 BG
    - cron: '0 1 * * *'     # 04:00 BG
    - cron: '0 2 * * *'     # 05:00 BG
    - cron: '0 3 * * *'     # 06:00 BG
    - cron: '0 4 * * *'     # 07:00 BG
    - cron: '0 5 * * *'     # 08:00 BG
    - cron: '0 6 * * *'     # 09:00 BG
    - cron: '0 7 * * *'     # 10:00 BG
    - cron: '0 8 * * *'     # 11:00 BG
    - cron: '0 9 * * *'     # 12:00 BG
    - cron: '0 10 * * *'     # 13:00 BG
    - cron: '0 11 * * *'     # 14:00 BG
    - cron: '0 12 * * *'     # 15:00 BG
    - cron: '0 13 * * *'     # 16:00 BG
    - cron: '0 14 * * *'     # 17:00 BG
    - cron: '0 15 * * *'     # 18:00 BG
    - cron: '0 16 * * *'     # 19:00 BG
    - cron: '0 17 * * *'     # 20:00 BG
    - cron: '0 18 * * *'     # 21:00 BG
    - cron: '0 19 * * *'     # 22:00 BG
    - cron: '0 20 * * *'     # 23:00 BG
    - cron: '0 21 * * *'     # 00:00 BG
    - cron: '0 22 * * *'     # 01:00 BG
    - cron: '0 23 * * *'     # 02:00 BG
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Сухо пускане — картите се печатат в лога, нищо не заминава за Telegram'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # 🔴 ОБЩА ГРУПА С ОЦЕНИТЕЛЯ (11.08.2026).
  # Предсказателят и оценителят пишат ЕДИН И СЪЩ файл — predict_log.json.
  # Затова кронът на оценителя стои с половин час отстъп. Измерено обаче:
  # за 7 дни двата се засякоха в рамките на 3 минути ПЕТ пъти, най-остро на
  # 13 СЕКУНДИ разлика (05.08, 19:55). Отстъпът не работи, защото GitHub
  # закъснява всеки от двата поотделно и случайно.
  # Една група върши това, което отстъпът само обещаваше: вторият изчаква.
  # Групата е ЕДНА за всички, които пипат общо състояние: предсказател,
  # оценител, рутер и съпорт. Така два рън-а никога не четат една опашка и
  # не пишат един файл едновременно.
  group: greenpicks-state
  cancel-in-progress: false     # закъсняло пускане се изчаква, не се убива

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Пълна история, за да може rebase-ът долу да работи спокойно.
          # Плитко копие и rebase не се разбират добре.
          fetch-depth: 0

      # 🔴 ДОБАВЕНО 12.08.2026. checkout@v4 сваля github.sha — върха от мига, в
      # който рънът е СЪЗДАДЕН, не когато е тръгнал. Concurrency групата държи
      # рънове да чакат; измерено върху 424 ръна, 39 (9.2%) са създадени,
      # докато друг от групата върви. Тоест работният файл може да е отпреди
      # чуждото писане — и state-ът се презаписва със стар.
      - name: Дръпни последното (checkout-ът може да е застоял)
        run: git pull --ff-only origin ${{ github.ref_name }} || echo "не превъртя чисто — карам с това, което имам"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CDN-ът на WTT (тенис на маса) отговаря САМО сгъстено с brotli.
      # Без модула цял един спорт мълчеше на всяко пускане.
      - name: Модул brotli (за тениса на маса)
        run: python -m pip install --quiet --disable-pip-version-check brotli

      # Портиерът. Ако математиката или стая-пазачът са счупени, спираме ТУК —
      # по-добре мълчание, отколкото крива карта в стаята.
      # 🔴 ЦЯЛОСТТА — ПРЕДИ ВСИЧКО ОСТАНАЛО (21.08.2026).
      #
      # Самопроверките пазят ПОВЕДЕНИЕТО на кода, който е налице. Никой не
      # пазеше самото НАЛИЧИЕ — и точно това ни ухапа: патч, построен върху
      # старо копие, върна назад цял пазач ЗАЕДНО с тестовете му. Резултат:
      # 790 зелени проверки, а една защита я нямаше.
      #
      # `cyalost.py` държи списък от белези — всеки е нещо, което вече е било
      # счупено или загубено веднъж. Стои ПЪРВИ, защото ако липсва защита,
      # няма смисъл да проверяваме дали останалото смята вярно.
      - name: Цялост — всичко ли е тук
        run: python cyalost.py

      - name: Самопроверка на модела
        env:
          PREDICT_DRY_RUN: '1'
          PREDICT_THREAD_ID: '27'
          # 🔴 БЕЗ ТЕЗИ ДВА РЕДА ДВЕ ПРОВЕРКИ НЕ СЕ ПУСКАТ (01.09.2026).
          # Проверките на адреса са зад `if PZ is not None and LINK_VKL`,
          # а LINK_VKL се чете от PAZAR_LINK. Стъпката не го подаваше →
          # функцията работеше ВКЛЮЧЕНА в производството, а тестът ѝ
          # вървеше ИЗКЛЮЧЕН. Мъртво покритие точно върху линка, който
          # собственикът поиска изрично.
          PAZAR_LINK: '1'
          # 🔴 PAZAR_IZTOCHNIK НЕ СЕ ПОДАВА ТУК, и това е нарочно. Сложих го
          # днес заедно с PAZAR_LINK и СВАЛИХ производството: с него редът
          # показва името на източника, а то е „pinnacle“ — забранена дума.
          # Затова проверката „източникът е ИЗКЛЮЧЕН по подразбиране“ гърми.
        run: python predictor.py selftest

      # 🔴 ОСЕМ МОДУЛА ВЪРВЯХА НЕПРОВЕРЕНИ (25.08.2026). Лов на слепи петна
      # намери, че pazar, pinnacle, itf, azia, volley_evro, sezon, sglasie и
      # zdrave носят около 460 самопроверки, които НИТО ЕДИН workflow не
      # изпълняваше. Точно тези модули държат цените, малкия тур и азиатския
      # бейзбол — тоест счупеше ли се цената, картите просто оставаха без
      # число и никой нямаше да гръмне.
      # Пускачът намира модулите САМ по диска, за да не остарее списък.
      # Мерено: 26 секунди за 18 модула и 2242 проверки.
      # 🔴 САМО ДОКЛАД, НЕ БЛОКИРА — и това е нарочно (25.08.2026).
      # Портата е нова и НЕ Е пускана в GitHub нито веднъж. Локално всичките
      # 2242 проверки минават, но GitHub е друга машина: друга мрежа, друг
      # Python, други часови зони. Падне ли там един модул по причина, която
      # тук не съществува, блокираща порта би СПРЯЛА ЦЕЛИЯ БОТ — тоест щеше
      # да причини точно аварията, срещу която е построена.
      #
      # Същият ред мина и портата за цялост: първо доклад в рутера, чак после
      # блокиране в предсказателя и оценителя.
      #
      # ➡️ ДА СЕ МАХНЕ `continue-on-error`, щом стъпката излезе зелена няколко
      #    дни подред. Дотогава провалът се вижда в Actions, но не спира нищо.
      - name: Всички самопроверки (18 модула · само доклад)
        continue-on-error: true
        run: python vsichki_testove.py

      - name: Пусни предсказателя
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # Резервните стойности НЕ са излишни: незададена променлива в GitHub
          # идва като празен низ и празният низ бие подразбиращото се в скрипта.
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          PREDICT_THREAD_ID: '27'
          # Незадължителни ключове — ако ги няма, идват празни и ботът кара
          # с TheSportsDB тест-ключа. Нищо не се чупи.
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY || vars.SPORTSDB_KEY }}
          # Настройки на модела — празна стойност = вътрешната подразбираща се.
          MAX_PICKS: ${{ vars.MAX_PICKS }}
          PREDICT_POOL: ${{ vars.PREDICT_POOL || '60' }}
          PREDICT_PER_SPORT: ${{ vars.PREDICT_PER_SPORT }}
          PREDICT_MIN_STRENGTH: ${{ vars.PREDICT_MIN_STRENGTH }}
          # 🔴 ОТКОВАНО 11.08.2026. Тук стоеше твърдо '18'. Списъкът в кода
          # порасна на 21: добавени бяха квалификациите за Лига Европа и за
          # Лигата на конференциите. Измерено на живо същия ден — на 13 август
          # тези два адреса дават 12 и 25 мача, а основните им (без _qual) са
          # празни през целия август. Числото 18 щеше да отреже точно тях.
          # Празна стойност = кодът пита ЦЕЛИЯ списък, какъвто и да стане утре.
          PREDICT_FOOT_SLUGS: ${{ vars.PREDICT_FOOT_SLUGS }}
          # 🔴 ДОБАВЕНО 11.08.2026. matches.yml подава COMBAT_THREAD_ID от vars,
          # а predict.yml не го подаваше — а двата бота четат СЪЩАТА променлива.
          # Смени ли се, боевете отиват в новата стая, а ММА-картите остават в
          # 328: две стаи, нито един ред грешка в лога.
          COMBAT_THREAD_ID: ${{ vars.COMBAT_THREAD_ID || '328' }}
          # 🔴 БЛИЗНАКЪТ НА ВЕЧЕ ОПРАВЕНИЯ COMBAT_THREAD_ID (11.08.2026).
          # Тези пет номера се четат от predictor.py, matches_bot.py И
          # router_bot.py — и не идваха от НИТО ЕДИН workflow. Живееха на
          # заковани резерви 5/6/7/8/4. Смени ли се стая, трите бота щяха да
          # пишат в старата без нито един ред грешка. Точно сценарият, който
          # коментарът за бойните спортове описва — само че на пет места.
          FOOTBALL_THREAD_ID: ${{ vars.FOOTBALL_THREAD_ID || '5' }}
          BASKET_THREAD_ID: ${{ vars.BASKET_THREAD_ID || '6' }}
          TT_THREAD_ID: ${{ vars.TT_THREAD_ID || '7' }}
          VOLLEY_THREAD_ID: ${{ vars.VOLLEY_THREAD_ID || '8' }}
          PICKS_THREAD_ID: ${{ vars.PICKS_THREAD_ID || '4' }}
          # Квота за спорт: 1 = всеки спорт с кандидат получава поне една карта
          # (без нея ММА не влизаше НИКОГА — звездите му са заковани на една).
          # 0 връща старото поведение, без пипане на код.
          PREDICT_KVOTA: ${{ vars.PREDICT_KVOTA }}
          # Пазачите на разписанието (по подразбиране 10 / 30 / 10):
          #   MAX_DAY    таван прогнози за ЦЕЛИЯ ден, за да не залее стаята
          #   HORIZON_H  докъде напред гледаме — далечният мач чака своя час
          #   LEAD_MIN   колко минути преди начало спираме да пускаме карта
          PREDICT_MAX_DAY: ${{ vars.PREDICT_MAX_DAY || '80' }}
          # 🔴 КЛЮЧАЛКИТЕ НА СПЯЩИТЕ СПОРТОВЕ (01.09.2026).
          #
          # Дотук тези пет променливи НЕ СЕ ПОДАВАХА изобщо — тоест
          # ключалките в predictor.py бяха недостижими отвън и амер.
          # футболът остана на нула карти, макар NCAA да отвори на 29.08.
          #
          # ВСЯКА Е С РЕЗЕРВА, и това не е украса: незададена променлива в
          # GitHub идва като ПРАЗЕН НИЗ, а празният низ БИЕ подразбиращото
          # се в скрипта. Без `|| ...` празният PREDICT_IZKL би отворил
          # хокея И амер. футбола ВЕДНАГА, без никой да е поискал.
          # Резервите са равни на днешното поведение: нищо не се мени,
          # докато собственикът не сложи стойност.
          #
          #   PREDICT_IZKL          кои спортове мълчат.
          #                         „hockey" пуска амер. футбола.
          #                         „" пуска всичко (внимателно).
          #   PREDICT_AMFUTBOL_MAX  карти на пускане за амер. футбол (0 = спи)
          #   PREDICT_BOKS_MAX      същото за бокса. ❗ Боксът НЯМА кой да
          #                         го отсъди — карта без присъда виси вечно.
          #   PREDICT_ESPORT_MAX    същото за електронните спортове.
          #   PREDICT_STAYA_REZHIM  pak (както днес) · kratko (един ред в
          #                         стаята на спорта) · bez (само в канала)
          PREDICT_IZKL: ${{ vars.PREDICT_IZKL || 'hockey' }}
          PREDICT_AMFUTBOL_MAX: ${{ vars.PREDICT_AMFUTBOL_MAX || '6' }}

          # 🔴 МЪРТВИТЕ РЪЧКИ (01.09.2026). predictor.py чете 93 ключа от
          # средата, а тук се подаваха 43. Между липсващите бяха и трите неща,
          # направени същия ден: денонощните часове, прагът за пресмелите карти
          # и местният тенис на маса. Кодът ги четеше, самопроверката беше
          # зелена, а собственикът нямаше как да ги завърти — променливата
          # никога не стигаше до процеса.
          # Празна стойност е БЕЗОПАСНА: env_int/env_float правят int("") ->
          # ValueError -> подразбиране. Тоест ненаписана променлива не мени
          # нищо, а написана вече ДЕЙСТВА.
          # Пази се от проверката «predict.yml подава всяка ръчка на
          # собственика» в selftest, срещу списъка KLYUCHOVE_ZA_YML.
          #
          #   QUIET_TO=0  -> денонощен режим (върви С PREDICT_MAX_DAY=90)
          #   QUIET_TO=8  -> старото поведение 08:00-22:00
          PREDICT_QUIET_TO: ${{ vars.PREDICT_QUIET_TO || '0' }}
          # 🔴 ВКЛЮЧЕНО ДОКРАЙ 02.09.2026, В САМИЯ ФАЙЛ, не през променливи.
          # Черната кутия (рън 12:14) показа, че сложените в GitHub променливи
          # НЕ стигат до процеса: MAX_DAY 60, POOL 44, HTTP_BUDGET 320,
          # QUIET_TO 8 — всичките «по подразбиране». Затова стойностите стоят
          # ТУК. `vars.X ||` остава отпред: сложи ли се променлива, тя пак бие.
          # Пътят назад е един ред: върни '0' на '8' и денонощието се гаси.
          # 🔴 ЧИСЛАТА СА ТАВАНИТЕ НА САМИЯ КОД, не желани стойности.
          # env_int реже: MAX_DAY на 80, POOL на 60. Написах първо 90 и 80,
          # измерих и видях, че излизат 80 и 60 — тоест файлът щеше да
          # обещава едно, а ботът да прави друго. Пише се истината.
          # Искаш ли по-високо, таванът в predictor.py трябва да се вдигне
          # ПЪРВО, с измерване — не се заобикаля оттук.
          PREDICT_QUIET_FROM: ${{ vars.PREDICT_QUIET_FROM || '23' }}
          #   колко над пазара е «пресмела» карта (0.15 = 15 точки)
          PREDICT_SMELOST_MAX: ${{ vars.PREDICT_SMELOST_MAX }}
          #   вторият източник за тенис на маса (местните лиги)
          PREDICT_TTLOKAL: ${{ vars.PREDICT_TTLOKAL }}
          PREDICT_TTLOKAL_MAX: ${{ vars.PREDICT_TTLOKAL_MAX }}
          PREDICT_TTLOKAL_SCALE: ${{ vars.PREDICT_TTLOKAL_SCALE }}
          PREDICT_ITF_MAX: ${{ vars.PREDICT_ITF_MAX }}
          #   колко часа напред се гледа за трите спорта с дълъг хоризонт
          PREDICT_HORIZON_AMF: ${{ vars.PREDICT_HORIZON_AMF }}
          PREDICT_HORIZON_HOK: ${{ vars.PREDICT_HORIZON_HOK }}
          PREDICT_HORIZON_MMA: ${{ vars.PREDICT_HORIZON_MMA }}
          #   спешните карти (мач преди следващото пускане)
          PREDICT_MAX_URGENT: ${{ vars.PREDICT_MAX_URGENT }}
          PREDICT_URGENT_LEAD_H: ${{ vars.PREDICT_URGENT_LEAD_H }}
          PREDICT_BOKS_MAX: ${{ vars.PREDICT_BOKS_MAX || '0' }}
          # 🎮 ЕСПОРТЪТ СЕ БУДИ — САМО CS2 (01.09.2026).
          #
          # Вратата за резултати е НАМЕРЕНА и ИЗМЕРЕНА: Smarkets дава
          # победителя ПОИМЕННО, без ключ и без преправен подпис.
          #   api.smarkets.com/v3/markets/{id}/contracts/ → 200
          #   {"name":"Team WE","state_or_outcome":"winner"}
          #
          # ПОКРИТИЕТО Е РАЗЛИЧНО ПО ИГРА, измерено на живо:
          #   CS2     37 мача на 31.08, 36 с победител  →  97%
          #   Dota 2   4 мача,           4 с победител  → 100%
          #   LoL      5 от 15                          →  33%  ← НЕ
          #   Valorant Smarkets няма такъв тип събитие  →   0%  ← НЕ
          # Целият кръг, изпитан на десет истински вчерашни мача:
          #   10 от 10 = 100% (вкл. G2 срещу Natus Vincere → G2)
          #
          # 🔴 ЗАТОВА САМО CS2. Карта без път до присъда виси вечно и
          # трови процента на целия спорт — урокът от ITF. LoL и
          # Valorant влизат, когато и за тях има извор.
          #
          # НАЗАД: PREDICT_ESPORT_MAX=0 и спортът заспива.
          PREDICT_ESPORT_MAX: ${{ vars.PREDICT_ESPORT_MAX || '3' }}
          PREDICT_ESPORT_IGRI: ${{ vars.PREDICT_ESPORT_IGRI || 'cs2' }}
          # 🔑 ОСТАНАЛИТЕ РЪЧКИ (01.09.2026).
          #
          # Одитен агент преброи: 17 от 32 ключа в кода НЕ СЪЩЕСТВУВАХА за
          # собственика — тоест „пътят назад" за тях беше редакция на код и
          # ново качване, не завъртане на ключ. Това чупи правило 3 от
          # протокола („изход, не надежда").
          # Най-лошият случай: PREDICT_ISKAM_PAZAR=0 е записан В КОМЕНТАРА
          # като път назад, а го нямаше в нито един workflow.
          #
          # ВСЯКА РЕЗЕРВА Е РАВНА НА ДНЕШНОТО ПОВЕДЕНИЕ. Незададена
          # променлива в GitHub идва като ПРАЗЕН НИЗ, а празният низ БИЕ
          # подразбиращото се в скрипта — без `|| ...` тук всичко би се
          # обърнало наопаки.
          #
          #   POKAZHI_CENA=0       маха 💰 от картите И от фиша
          #   POKAZHI_IZTOCHNIK=1  добавя „(ESPN)" до цената
          #   ISKAM_PAZAR=0        пуска и карти без пазарна цена
          #   PRICHINI=1..4        колко реда 📊 на картата
          #   SHOW_RECORD=0        маха реда „Футболът досега: N от M"
          #   KOEF=0               маха обратната сметка от процента
          #   SPORTS="football,tennis"   само изброените спортове
          #   MMA_LIGI / AMFUTBOL_LIGI / ESPORT_AKADEMII   стеснения
          PREDICT_POKAZHI_CENA: ${{ vars.PREDICT_POKAZHI_CENA || '1' }}
          PREDICT_POKAZHI_IZTOCHNIK: ${{ vars.PREDICT_POKAZHI_IZTOCHNIK || '0' }}
          PREDICT_ISKAM_PAZAR: ${{ vars.PREDICT_ISKAM_PAZAR || '1' }}
          PREDICT_PRICHINI: ${{ vars.PREDICT_PRICHINI || '2' }}
          PREDICT_SHOW_RECORD: ${{ vars.PREDICT_SHOW_RECORD || '1' }}
          # 🔴 ПЕНСИОНИРАНА РЪЧКА (отбелязано 01.09.2026). Тя НЕ управлява
          # нищо: KOEF_VKL се среща само в дефиницията си, защото
          # obratno_na_procenta е спряна на 25.08. Редът остава, за да не
          # чупи чужда настройка, но НЕ Е път назад — не разчитай на него.
          PREDICT_KOEF: ${{ vars.PREDICT_KOEF || '1' }}
          PREDICT_SPORTS: ${{ vars.PREDICT_SPORTS }}
          PREDICT_MMA_LIGI: ${{ vars.PREDICT_MMA_LIGI }}
          PREDICT_AMFUTBOL_LIGI: ${{ vars.PREDICT_AMFUTBOL_LIGI }}
          PREDICT_ESPORT_AKADEMII: ${{ vars.PREDICT_ESPORT_AKADEMII || '0' }}
          # ➕ ОЩЕ ОТ СЪЩИЯ МАЧ — гол-гол, очакван резултат, тотал сетове.
          #
          # 🔴 ДВЕ ТВОИ ПОРЪЧКИ СИ ПРОТИВОРЕЧАТ:
          #   „гол-гол" — поискано поименно
          #   25.08: „картите са дълги и странни" → блокът е МАХНАТ и има
          #          заключваща проверка, която го държи махнат
          #   01.09: „трябва да има ФУЛ ИНФО" → обратното
          #
          # Данните се смятат и се хвърлят: полетата second и third се
          # пълнят на ОСЕМ места, а картата не ги четеше — нула читатели.
          # Затова: ключ, ИЗКЛЮЧЕН по подразбиране. Днес нищо не се мени.
          # PREDICT_OSHTE=1 връща гол-гола на ЕДИН ред.
          # Цената: картата расте с един ред и получава втори процент.
          PREDICT_OSHTE: ${{ vars.PREDICT_OSHTE || '0' }}
          PREDICT_STAYA_REZHIM: ${{ vars.PREDICT_STAYA_REZHIM || 'pak' }}
          # 💰 ЦЕНАТА И ЛИНКЪТ НА КАРТАТА (01.09.2026).
          #
          # ВКЛЮЧЕНИ ПО ИЗРИЧНО РЕШЕНИЕ НА СОБСТВЕНИКА: „да пускай цените на
          # картите и линкове давай на макс". Той е искал това и по-рано —
          # записано е в predictor.py ред 5754 — и тогава е било отказано.
          # Сега решението е негово и е взето.
          #
          #   PAZAR_IZTOCHNIK=1  →  „📊 Пазар: 1.85 (ESPN)"
          #   PAZAR_LINK=1       →  добавя адрес на САМИЯ мач
          #
          # СПИРА СЕ С ПРОМЕНЛИВА, БЕЗ ПИПАНЕ НА КОД: сложи 0 в GitHub.
          #
          # 🔴 ДВЕ НЕЩА, ИЗМЕРЕНИ И ЗАПИСАНИ ТУК, ЗА ДА НЕ СЕ ЗАБРАВЯТ:
          # 1. Линкът работи САМО за футбол, бейзбол и баскетбол — 244 от
          #    1082 карти (22.6%). Другите спортове нямат ESPN номер по
          #    устройство. Проверено с истински срещу измислен номер: 200
          #    срещу 404. Pinnacle адресите НЕ СА доказуеми — сайтът им
          #    връща същите 14258 байта за истински номер, за нула и за
          #    безсмислица, тоест 200 там не доказва нищо.
          # 2. Самата ESPN страница, към която води линкът, съдържа
          #    „draftkings" 51 пъти, „odds" 97 и „bet365" 2. Нашият ред е
          #    чист, но адресът води при тях. Собственикът го знае.
          PAZAR_IZTOCHNIK: ${{ vars.PAZAR_IZTOCHNIK || '1' }}
          PAZAR_LINK: ${{ vars.PAZAR_LINK || '1' }}
          PAZAR_PROZOREC: ${{ vars.PAZAR_PROZOREC || '6' }}
          PAZAR_TIMEOUT: ${{ vars.PAZAR_TIMEOUT || '12' }}
          PREDICT_TT_SCALE_NISKA: ${{ vars.PREDICT_TT_SCALE_NISKA }}
          PREDICT_HORIZON_H: ${{ vars.PREDICT_HORIZON_H }}
          PREDICT_LEAD_MIN: ${{ vars.PREDICT_LEAD_MIN }}
          # 🔴 ВТОРАТА ПРОГНОЗА ОТ СЪЩИЯ МАЧ (19.08.2026): над/под ЛИНИЯТА
          # НА ПАЗАРА, с неговата цена. Нула нови източника и нула нови
          # заявки — чете се същият отговор, от който идва 1/Х/2.
          #   PREDICT_TOTAL_PAZAR  0 изключва всичко, без пипане на код
          #   PREDICT_TOTAL_MAX    най-много тотал-карти от едно пускане
          #   PREDICT_TOTAL_MIN    праг; празно = прагът на двоичните
          PREDICT_TOTAL_PAZAR: ${{ vars.PREDICT_TOTAL_PAZAR }}
          PREDICT_TOTAL_MAX: ${{ vars.PREDICT_TOTAL_MAX }}
          PREDICT_TOTAL_MIN: ${{ vars.PREDICT_TOTAL_MIN }}
          # 🔴 ТАВАНЪТ ЗАЯВКИ СЛЕДВА ШИРОКАТА ЛУПА (19.08.2026). Измерено:
          # лупа 17 срещи → 168 заявки, лупа 34 → 205. Пълен басейн иска
          # ~227, тоест старите 220 щяха да се скъсат, а скъсването сваля
          # целия рън.
          PREDICT_HTTP_BUDGET: ${{ vars.PREDICT_HTTP_BUDGET || '520' }}
          # Празно при разписание, 'true' само когато човек натисне бутона.
          PREDICT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python predictor.py

      # 🔴 ОПАШКАТА СЕ ВОЗИ НА ГЪРБА НА ПРЕДСКАЗАТЕЛЯ (11.08.2026).
      #
      # Измерено върху 7 дни: router.yml е разписан на всеки 10 минути, тоест
      # 1008 пускания за седмица. Реалните са 60 — ШЕСТ ПРОЦЕНТА. Медианната
      # пауза между два рутера е 210 минути вместо 10, най-дългата 777.
      # А рутерът е ЕДИНСТВЕНИЯТ четец на опашката: и постовете от канала, и
      # въпросите до съпорта минават през него. Тоест човек, който пише на бота,
      # чака средно три часа и половина.
      #
      # GitHub задушава честите кронове, но редките тръгват почти винаги:
      # predict.yml е 55 от 56 за същата седмица. Затова опашката се разнася и
      # тук — осем сигурни пускания на ден вместо едно на всеки два дни.
      #
      # Два рутера НЕ МОГАТ да четат опашката едновременно: router.yml е в
      # същата concurrency група greenpicks-state, значи вторият изчаква.
      # continue-on-error: провал на рутера НЕ бива да оцвети в червено рън,
      # в който картите вече са излезли.
      - name: Разнеси опашката (рутер и съпорт)
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          SUPPORT_THREAD_ID: ${{ vars.SUPPORT_THREAD_ID || '11' }}
          ADMIN_CHAT_ID: ${{ vars.ADMIN_CHAT_ID }}
          SUPPORT_ADMIN_IDS: ${{ vars.SUPPORT_ADMIN_IDS }}
          SUPPORT: ${{ vars.SUPPORT }}
          SUPPORT_FAQ_URL: ${{ vars.SUPPORT_FAQ_URL }}
        run: python router_bot.py

      # Тефтерът се връща в repo-то. always() е нарочно: predictor.py записва
      # след ВСЯКА пусната карта, тоест ако пускането е умряло на третата
      # среща, първите две вече са в тефтера и ТРЯБВА да се запазят — иначе
      # следващото пускане ги праща втори път.
      - name: Запази predict state
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "greenpicks-bot"
          git config user.email "bot@greenpicks"
          # Само predict_state.json: predictor.py пише единствено него (ред 141).
          # Тук стоеше и "git add sent_predictions.json" — файл, който НИКОЙ .py
          # в repo-то не пише и не чете (проверено с grep) — мъртвото стейджване
          # е махнато.
          git add predict_state.json 2>/dev/null || true
          # predict_log.json = ДНЕВНИКЪТ НА ТВЪРДЕНИЯТА: кого сме посочили, с
          # каква вероятност и колко звезди. От него живее scorer.py, който
          # пълни стая 9 „Резултати" и стая 10 „Печеливши". Без този ред
          # дневникът умира заедно с рънъра и двете стаи остават празни
          # завинаги — а ботът пак ще твърди, без никой да го проверява.
          # 🔴 АРХИВЪТ ВЪРВИ ЗАЕДНО С ДНЕВНИКА (18.08.2026) — ИНАЧЕ ЗАГУБА.
          # Оценителят мести приключените стари записи в predict_log_arhiv.json
          # и връща дневника СВИТ. Комитне ли се само свитият дневник, без
          # архива, преместените записи изчезват ЗАВИНАГИ. Двата файла са едно
          # цяло и се добавят заедно, един по един (липсващ файл не бива да
          # изхвърля другия — виж 12.08).
          for f in predict_log.json predict_log_arhiv.json; do
            [ -f "$f" ] && git add "$f"
          done
          # Рутерът се вози тук (виж стъпката горе) — неговият offset ТРЯБВА да
          # се върне в repo-то, иначе следващият рун чете опашката отначало и
          # дублира постовете по стаите.
          # 🔴 ЕДИН ПО ЕДИН (12.08.2026). `git add a b nyama.json` НЕ добавя
          # НИЩО — git отхвърля целия pathspec, щом един файл липсва, а
          # `|| true` крие изход 128. Проверено в истинско repo: stage-нато
          # остава ПРАЗНО и стъпката излиза ЗЕЛЕНА, без да е запазила нищо.
          for f in router_state.json support_state.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Тефтерът е без промяна — няма какво да се връща."
            exit 0
          fi
          git commit -m "predict state"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then
              pushed=1
              break
            fi
            echo "Push-ът не мина (опит $i) — дърпам и опитвам пак."
            git pull --rebase --autostash || git rebase --abort || true
            sleep $((RANDOM % 6 + 3))
          done
          if [ "$pushed" != "1" ]; then
            echo "ЧЕРВЕНО: тефтерът НЕ се върна в repo-то."
            echo "Следващото пускане ще повтори днешните срещи — оправи ръчно."
            exit 1
          fi
          echo "Тефтерът е запазен."

name: dedupe (чистач на повторения)

# ─────────────────────────────────────────────────────────────────────────────
# ЗАЩО ГО ИМА
# Собственикът се оплака, че стаите са „наблъскани с повтарящи се съобщения".
# Инструментът dedupe_clean.py съществуваше отдавна, но НЯМАШЕ откъде да се
# пусне — нито крон, нито бутон. Затова никога не е чистил нищо.
#
# БЕЗ КРОН — НАРОЧНО
# Това е инструмент, който ТРИЕ. Триенето не е нещо, което да тръгва само в
# 3 сутринта. Пуска се на ръка, гледа се какво предлага, и чак после се трие.
#
# КАК СЕ ПОЛЗВА (двете стъпки НЕ се прескачат)
#   1. ПОГЛЕДНИ:  режим scan, „наистина ли да трия" = НЕ  (така е по подразбиране)
#      Нищо не се трие. В лога излиза точно кои групи повторения е намерил,
#      кое копие пази и кое би махнал.
#   2. ТРИЙ:      същият режим, „наистина ли да трия" = ДА, и напиши ТРИЙ в
#      полето за потвърждение. Двете заедно — за да не стане с едно невнимателно
#      натискане.
#
# КАКВО НЕ МОЖЕ ДА СЕ СЛУЧИ ОТ ТУК (заковано в самия скрипт, не тук)
#   • Стая 4 „Фишове на деня" не се пипа. Там пише само човекът.
#   • Контейнерите на стаите не се трият — включително 328 „Бойни спортове".
#   • Най-новото копие от всяка група остава. Цяла група никога не изчезва.
#   • Не може да се докаже в коя стая е дадено съобщение → то НЕ се трие.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Какво да огледа'
        type: choice
        default: scan
        options:
          - scan
          - thread
          - channel
      thread:
        description: 'Само за режим „thread“: номер на стаята (5, 6, 26, 27, 328…)'
        type: string
        default: ''
      wipe:
        description: 'ИЗЧИСТИ ЦЯЛАТА стая (само нашите съобщения). Иска режим thread + номер + ТРИЙ.'
        type: boolean
        default: false
      really_delete:
        description: 'Наистина ли да трия? Без отметка само показва плана.'
        type: boolean
        default: false
      confirm:
        description: 'Напиши ТРИЙ (или DELETE), за да разрешиш триенето'
        type: string
        default: ''
      window:
        description: 'Колко съобщения назад да гледа'
        type: string
        default: '400'
      probe_sleep:
        description: 'Пауза между проверките, сек. По-малко = по-бързо, но по-близо до лимита.'
        type: string
        default: '1.2'

permissions:
  contents: read

concurrency:
  group: dedupe-bot
  cancel-in-progress: false      # триене не се убива по средата

jobs:
  dedupe:
    runs-on: ubuntu-latest
    # 55, не 30. Изчистването на стая проверява всяко съобщение в прозореца
    # поотделно; при 900 съобщения първият опит се уби точно на 30-та минута
    # и стаята остана наполовина изчистена. По-добре дълъг таван, отколкото
    # прекъснато чистене.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Портиерът. Счупена ли е логиката на вратата, тук спираме — по-добре
      # нищо да не се изтрие, отколкото да се изтрие грешното.
      - name: Самопроверка на чистача
        env:
          # 🔴 СУХ РЕЖИМ ЗА САМОПРОВЕРКАТА (05.09.2026). Две проверки,
          # които искат УСПЕХ от вратата навън, счупиха рутера за два дни:
          # 400 ръна, нула успешни. Тази стъпка пуска САМО самопроверка —
          # тя няма право да праща нищо, каквото и да реши следващият автор.
          DEDUPE_DRY: '1'
          DEDUPE_SELFTEST: '1'
        run: python dedupe_clean.py --selftest

      - name: Чисти
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          DEDUPE_MODE: ${{ github.event.inputs.mode }}
          DEDUPE_THREAD: ${{ github.event.inputs.thread }}
          # 🔴 Празно поле при ръчно пускане дава празен низ, а
          # dedupe_clean.py прави int(.get(K,"400")) → ValueError още при
          # внасянето. Тоест workflow-ът пада, преди да е направил нищо.
          DEDUPE_WINDOW: ${{ github.event.inputs.window || '400' }}
          # Скоростта на сондирането. По подразбиране 1.2 сек на съобщение —
          # безопасно, но при прозорец от 900 съобщения това са 18 минути само
          # за проверката и рънът се уби на 30-та минута (виж timeout-minutes
          # по-долу, вдигнат заради същото). 0.6 сек е двойно по-бързо и още
          # далеч под лимита на Telegram.
          DEDUPE_PROBE_SLEEP: ${{ github.event.inputs.probe_sleep || '1.2' }}
          # Двоен ключ: отметката дава DEDUPE_DRY=0, а думата ТРИЙ отключва
          # вътрешното потвърждение. Липсва ли едното, скриптът само показва.
          DEDUPE_DRY: ${{ github.event.inputs.really_delete == 'true' && '0' || '1' }}
          # ИЗЧИСТВАНЕ НА ЦЯЛА СТАЯ. За разлика от търсенето на повторения, тук
          # излизат ВСИЧКИ наши съобщения в стаята. Нужно е, защото спортните
          # стаи бяха пълни със стари новини от предишната архитектура — те не
          # са дублирани (всяка новина е различна), затова чистачът ги
          # подминаваше. Контейнерът на темата и чуждите съобщения остават.
          DEDUPE_WIPE: ${{ github.event.inputs.wipe == 'true' && '1' || '0' }}
          # ⚠️ ПРЕВОД, а не украса. Скриптът чака английските думи DELETE и WIPE.
          # Първата версия на този бутон казваше на човека да напише „ТРИЙ" и
          # рънът падаше с код 12 („реалното триене иска DEDUPE_CONFIRM=DELETE").
          # Тук българската дума се превежда според това какво се иска.
          DEDUPE_CONFIRM: ${{ github.event.inputs.wipe == 'true' && 'WIPE' || ((github.event.inputs.confirm == 'ТРИЙ' || github.event.inputs.confirm == 'DELETE') && 'DELETE' || github.event.inputs.confirm) }}
          # Каналът се пипа само ако изрично е избран режим channel.
          DEDUPE_ALLOW_CHANNEL: ${{ github.event.inputs.mode == 'channel' && '1' || '0' }}
          # Честен отчет кои id-та наистина са изтрити.
          DEDUPE_EXACT: '1'
        run: python dedupe_clean.py

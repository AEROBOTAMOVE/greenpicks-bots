name: content (напълни стаите и канала)

# САМО НА РЪКА. Зареждане на съдържание, не дневен ритъм.
#   rooms   -> seed_rooms.py    — стаите на групата (стая 4 е забранена в скрипта)
#   channel -> channel_seed.py  — витрината, самият канал
#   both    -> първо стаите, после канала
# Съвет: първият път пусни със "сухо пускане" и виж лога.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Къде сеем: rooms / channel / both'
        default: 'channel'
        type: choice
        options: [channel, rooms, both]
      dry_run:
        description: 'Сухо пускане — всичко се печата в лога, нищо не заминава'
        type: boolean
        default: false

permissions:
  # write: паметта на канала се връща в хранилището (виж последната стъпка)
  contents: write

concurrency:
  group: content-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Стаите на групата
        if: ${{ github.event.inputs.target == 'rooms' || github.event.inputs.target == 'both' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          # 🔴 @green_picks_info_bot, НЕ @greenpicks_support_bot (08.09.2026).
          # Вторият е мъртъв бот; channel_seed.py:71 и reset.py:13 носят
          # поправката от 11.08.2026, но тя не беше стигнала ДОТУК —
          # тоест ръчното зареждане слагаше в канала хващалка към бот,
          # който не отговаря. support_bot.py:165 казва кой работи днес.
          SUPPORT: ${{ vars.SUPPORT || '@green_picks_info_bot' }}
          SEED_DELAY: '2.0'
          SEED_DRY: ${{ github.event.inputs.dry_run }}
        run: python seed_rooms.py

      - name: Канала (витрината)
        if: ${{ github.event.inputs.target == 'channel' || github.event.inputs.target == 'both' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          # 🔴 @green_picks_info_bot, НЕ @greenpicks_support_bot (08.09.2026).
          # Вторият е мъртъв бот; channel_seed.py:71 и reset.py:13 носят
          # поправката от 11.08.2026, но тя не беше стигнала ДОТУК —
          # тоест ръчното зареждане слагаше в канала хващалка към бот,
          # който не отговаря. support_bot.py:165 казва кой работи днес.
          SUPPORT: ${{ vars.SUPPORT || '@green_picks_info_bot' }}
          GROUP_LINK: "${{ vars.GROUP_LINK || 'https://t.me/+_oYsaYaVKU80Yjc0' }}"
          CHANNEL_SEED_DRY: ${{ github.event.inputs.dry_run }}
        run: python channel_seed.py

      # 🔴 ПАМЕТТА НА КАНАЛА СЕ ВРЪЩА В ХРАНИЛИЩЕТО (15.09.2026). Без тази
      # стъпка channel_seed_state.json умираше с рънъра: всяко ръчно пускане
      # «не помнеше» приветствието и пращаше НОВО — така се появи второ.
      # always(): записаното преди евентуален срив също трябва да се върне.
      - name: Запази паметта на канала
        if: ${{ always() && github.event.inputs.dry_run != 'true' && (github.event.inputs.target == 'channel' || github.event.inputs.target == 'both') }}
        run: |
          git config user.name "greenpicks-bot"
          git config user.email "bot@greenpicks"
          [ -f channel_seed_state.json ] && git add channel_seed_state.json
          if git diff --cached --quiet; then
            echo "Паметта на канала е без промяна."
            exit 0
          fi
          git commit -m "channel state"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Паметта на канала е запазена."
              exit 0
            fi
            git pull --rebase --autostash || git rebase --abort || true
            sleep $((RANDOM % 6 + 3))
          done
          echo "ЧЕРВЕНО: паметта на канала НЕ се върна. Следващото пускане ще осинови закачения пост."
          exit 1

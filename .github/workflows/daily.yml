name: daily-rhythm (дневен ритъм)

# 🚫 КАНАЛЪТ Е САМО ЗА ЧОВЕКА. Този ритъм НЕ пипа канала.
#    21:00 обзорът отива в стая 27 „БОТА ПРЕДРИЧА".
#    23:00 резултатите отиват в стая 9 „Резултати и статистика" (един пост на ден).
#    Новините са само в стая 26 и се правят от news.yml — затова тук няма 08:00 крон.

on:
  schedule:
    - cron: '0 18 * * *'    # 21:00 BG — обзор на бота → стая 27
    - cron: '0 20 * * *'    # 23:00 BG — резултати  → стая 9
  workflow_dispatch:
    inputs:
      mode:
        description: 'overview (стая 27) / results (стая 9) / selftest / topnews (пенсиониран)'
        default: 'overview'
        type: choice
        options: [overview, results, selftest, topnews]
      force:
        description: 'Пусни пак дори ако състоянието казва, че днес вече е пратено'
        default: false
        type: boolean

permissions:
  contents: write
concurrency:
  group: daily-bot
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Определи режима
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            "0 18 * * *") echo "mode=overview" >> $GITHUB_OUTPUT ;;
            "0 20 * * *") echo "mode=results"  >> $GITHUB_OUTPUT ;;
            *)            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT ;;
          esac

      # Пазачите (канал + стаи 4-8) се проверяват ПРЕДИ да тръгне каквото и да е.
      - name: Самопроверка
        run: python daily_bot.py selftest

      - name: Пусни дневния бот
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          DAILY_MODE: ${{ steps.m.outputs.mode }}
          DAILY_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python daily_bot.py

      # ⚠️ ТУК БЕШЕ БЪГЪТ: комитваше се topnews_state.json — файл, който никой не пише.
      #    Затова състоянието никога не оставаше и постовете можеха да се повторят.
      #    Ботът пише daily_state.json — него комитваме.
      - name: Запази състоянието (daily_state.json)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add daily_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            for i in 1 2 3 4 5; do
              git commit -m "daily state" && git pull --rebase && git push && break
              sleep $((RANDOM % 5 + 2))
            done
          else
            echo "daily_state.json не се е променил — няма какво да пазя."
          fi

name: daily-rhythm (дневен ритъм)

# 🚫 КАНАЛЪТ Е САМО ЗА ЧОВЕКА. Този ритъм НЕ пипа канала.
#    20:00 — поглед НАПРЕД: какво предстои утре → стая 9. Един пост на ден.
#    Обзорът на деня НЕ е тук — той е на scorer.py, който има отсъдените прогнози.
#    Новините са само в стая 26 и се правят от news.yml — затова тук няма 08:00 крон.

on:
  schedule:
    # GitHub cron е ВИНАГИ UTC. Долу е ЛЯТНОТО време (BG = UTC+3); зимата всеки ред пада с един час български.
    # ВСИЧКО СВЪРШВА ДО 22:00 БГ (поръчка на собственика, 05.08.2026).
    # Кронът за 23:00 е МАХНАТ — беше след границата, а и пращаше ТРЕТИ пост в
    # стая 9. Там вече пише оценителят, а той разполага с истината: отсъдените
    # прогнози. Режимът „results" е ПЕНСИОНИРАН и не праща нищо.
    #
    # 🔴 ПОПРАВЕНО 11.08.2026. Тук пишеше „обзор на деня в 09:00 и 20:00" —
    # ТРЕТИ различен чифт часове за един и същ обзор, след 21:00/23:00 в
    # главата на daily_bot.py и 14:30/23:30 по стените в стая 9. Верните са
    # 13:30 и 22:30 UTC (виж score.yml), тоест около 14:30 и 23:30 български.
    - cron: '0 17 * * *'    # 20:00 BG (лято) — поглед напред за утре → стая 9
  workflow_dispatch:
    inputs:
      mode:
        description: 'overview (стая 9) / results (стая 9) / selftest / topnews (пенсиониран)'
        default: 'overview'
        type: choice
        options: [overview, results, selftest, topnews]
      force:
        description: 'Пусни пак дори ако състоянието казва, че днес вече е пратено'
        default: false
        type: boolean

permissions:
  contents: write
concurrency:
  group: daily-bot
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Пълна история, за да може rebase-ът долу да работи спокойно.
          fetch-depth: 0
      # 🔴 ДОБАВЕНО 12.08.2026. checkout@v4 сваля github.sha — върха от мига, в
      # който рънът е СЪЗДАДЕН, не когато е тръгнал. Concurrency групата държи
      # рънове да чакат; измерено върху 424 ръна, 39 (9.2%) са създадени,
      # докато друг от групата върви. Тоест работният файл може да е отпреди
      # чуждото писане — и state-ът се презаписва със стар.
      - name: Дръпни последното (checkout-ът може да е застоял)
        run: git pull --ff-only origin ${{ github.ref_name }} || echo "не превъртя чисто — карам с това, което имам"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Определи режима
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            "0 17 * * *") echo "mode=overview" >> $GITHUB_OUTPUT ;;
            *)            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT ;;
          esac

      # Пазачите (канал + стаи 4-8) се проверяват ПРЕДИ да тръгне каквото и да е.
      - name: Самопроверка
        run: python daily_bot.py selftest

      - name: Пусни дневния бот
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          # Ключът за резултатите: daily_bot.py гради API-то на TheSportsDB от
          # него (ред 53-54). Без него режим results кара на тест-ключ "123",
          # който връща 1-3 записа. matches.yml и predict.yml вече го подават.
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY || vars.SPORTSDB_KEY }}
          DAILY_MODE: ${{ steps.m.outputs.mode }}
          DAILY_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python daily_bot.py

      # 🔴 ЗАСЯВАНЕ НА НОВИТЕ СТАИ — БЕЗ БУТОН (11.08.2026)
      #
      # Тенисът и бейзболът получаваха карти в стая без нито ред обяснение кой
      # ги прави и как се четат. Обучителният пост стоеше готов в seed_rooms.py
      # и чакаше някой да пусне seed.yml на ръка. Чакаше седмици.
      #
      # SEED_ONLY_NEW=1 засява САМО стая, която НИКОГА не е засявана, и помни
      # кои са в seed_state.json. Тоест: първият рън праща двата поста,
      # всеки следващ вижда, че няма нищо ново, и мълчи.
      # continue-on-error — това е допълнение към деня, а не самият ден.
      - name: Засей стаите, които още нямат обучителен пост
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          SUPPORT: ${{ vars.SUPPORT || '@green_picks_info_bot' }}
          # GROUP_LINK НЕ се подава: seed_rooms.py не съдържа този низ
          # изобщо (проверено с grep). Мъртва променлива лъже, че
          # управлява нещо — и следващият човек ще я търси половин час.
          SEED_ONLY_NEW: '1'
        run: python seed_rooms.py

      # 🩺 ЗДРАВЕН ПРЕГЛЕД. Отговаря на въпроса, който собственикът задава всеки
      # ден: „защо еди-кой си спорт е празен". Пише отговора във файл, който се
      # връща в хранилището — дневникът на Actions не се чете отвън.
      # Излиза с 1 при намерен проблем, но continue-on-error пази деня.
      - name: Здравен преглед
        continue-on-error: true
        run: python zdrave.py 2>&1 | tee zdrave.txt

      # ⚠️ ТУК БЕШЕ БЪГЪТ: комитваше се topnews_state.json — файл, който никой не пише.
      #    Затова състоянието никога не оставаше и постовете можеха да се повторят.
      #    Ботът пише daily_state.json — него комитваме.
      # ⚠️ ВТОРИ БЪГ (оправен): старият retry-цикъл държеше commit-а ВЪТРЕ в опита
      #    (commit && pull && push && break) — след първи отхвърлен push всяка
      #    следваща итерация умираше на "nothing to commit", pull/push не се
      #    повтаряха, а стъпката излизаше зелена без комит на remote. Състезанието
      #    е реално: daily бута в 18:00/20:00 UTC, router бута на всеки 10 мин.
      #    Сега: commit ВЕДНЪЖ, после само pull --rebase + push в цикъла, и
      #    провалът е ЧЕРВЕН (exit 1) — същият модел като news/router/predict.
      # seed_state.json Е ЧАСТ ОТ ТОВА. Без връщането му режимът „само новите"
      # губи паметта си заедно с рънъра и праща същите постове пак утре.
      - name: Запази състоянието (daily_state, seed_state, zdrave)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # 🔴 ЕДИН ПО ЕДИН (12.08.2026). `git add a b nyama.json` НЕ добавя
          # НИЩО — git отхвърля целия pathspec, щом един файл липсва, а
          # `|| true` крие изход 128. Проверено в истинско repo: stage-нато
          # остава ПРАЗНО и стъпката излиза ЗЕЛЕНА, без да е запазила нищо.
          for f in daily_state.json seed_state.json zdrave.txt; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Нищо не се е променило — няма какво да пазя."
            exit 0
          fi
          git commit -m "daily state"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then
              pushed=1
              break
            fi
            echo "Push-ът не мина (опит $i) — дърпам и опитвам пак."
            git pull --rebase --autostash || git rebase --abort || true
            sleep $((RANDOM % 6 + 3))
          done
          if [ "$pushed" != "1" ]; then
            echo "ЧЕРВЕНО: daily_state.json НЕ се върна в repo-то."
            echo "Следващият рън може да повтори днешния пост — оправи ръчно."
            exit 1
          fi
          echo "Състоянието е запазено."

name: daily-rhythm (дневен ритъм)

# 🚫 КАНАЛЪТ Е САМО ЗА ЧОВЕКА. Този ритъм НЕ пипа канала.
#    20:00 — поглед НАПРЕД: какво предстои утре → стая 9. Един пост на ден.
#    Обзорът на деня НЕ е тук — той е на scorer.py, който има отсъдените прогнози.
#    Новините са само в стая 26 и се правят от news.yml — затова тук няма 08:00 крон.

on:
  schedule:
    # GitHub cron е ВИНАГИ UTC. Долу е ЛЯТНОТО време (BG = UTC+3); зимата всеки ред пада с един час български.
    # ВСИЧКО СВЪРШВА ДО 22:00 БГ (поръчка на собственика, 05.08.2026).
    # Кронът за 23:00 е МАХНАТ — беше след границата, а и пращаше ТРЕТИ пост в
    # стая 9. Там вече пише оценителят, а той разполага с истината: отсъдените
    # прогнози. Режимът „results" е ПЕНСИОНИРАН и не праща нищо.
    #
    # 🔴 ПОПРАВЕНО 11.08.2026. Тук пишеше „обзор на деня в 09:00 и 20:00" —
    # ТРЕТИ различен чифт часове за един и същ обзор, след 21:00/23:00 в
    # главата на daily_bot.py и 14:30/23:30 по стените в стая 9. Верните са
    # 13:30 и 22:30 UTC (виж score.yml), тоест около 14:30 и 23:30 български.
    - cron: '0 17 * * *'    # 20:00 BG (лято) — поглед напред за утре → стая 9
  workflow_dispatch:
    inputs:
      mode:
        description: 'overview (стая 9) / results (стая 9) / selftest / topnews (пенсиониран)'
        default: 'overview'
        type: choice
        options: [overview, results, selftest, topnews]
      force:
        description: 'Пусни пак дори ако състоянието казва, че днес вече е пратено'
        default: false
        type: boolean

permissions:
  contents: write
  # 🔑 ДОБАВЕНО 25.08.2026. Здравният преглед пита GitHub за ръновете на осем
  # workflow-а. С деклариран permissions блок всичко неизброено е „none",
  # тоест GITHUB_TOKEN би върнал 403 точно на това питане. Огледало на
  # pazach.yml:33, където същият ред стои със същата бележка.
  # ПЪТ НАЗАД: махаш този ред и env блока на прегледа — всичко е както вчера.
  actions: read
concurrency:
  group: daily-bot
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Пълна история, за да може rebase-ът долу да работи спокойно.
          fetch-depth: 0
      # 🔴 ДОБАВЕНО 12.08.2026. checkout@v4 сваля github.sha — върха от мига, в
      # който рънът е СЪЗДАДЕН, не когато е тръгнал. Concurrency групата държи
      # рънове да чакат; измерено върху 424 ръна, 39 (9.2%) са създадени,
      # докато друг от групата върви. Тоест работният файл може да е отпреди
      # чуждото писане — и state-ът се презаписва със стар.
      - name: Дръпни последното (checkout-ът може да е застоял)
        run: git pull --ff-only origin ${{ github.ref_name }} || echo "не превъртя чисто — карам с това, което имам"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Определи режима
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            "0 17 * * *") echo "mode=overview" >> $GITHUB_OUTPUT ;;
            *)            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT ;;
          esac

      # Пазачите (канал + стаи 4-8) се проверяват ПРЕДИ да тръгне каквото и да е.
      - name: Самопроверка
        run: python daily_bot.py selftest

      - name: Пусни дневния бот
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          # Ключът за резултатите: daily_bot.py гради API-то на TheSportsDB от
          # него (ред 53-54). Без него режим results кара на тест-ключ "123",
          # който връща 1-3 записа. matches.yml и predict.yml вече го подават.
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY || vars.SPORTSDB_KEY }}
          DAILY_MODE: ${{ steps.m.outputs.mode }}
          DAILY_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python daily_bot.py

      # 🔴 ЗАСЯВАНЕ НА НОВИТЕ СТАИ — БЕЗ БУТОН (11.08.2026)
      #
      # Тенисът и бейзболът получаваха карти в стая без нито ред обяснение кой
      # ги прави и как се четат. Обучителният пост стоеше готов в seed_rooms.py
      # и чакаше някой да пусне seed.yml на ръка. Чакаше седмици.
      #
      # SEED_ONLY_NEW=1 засява САМО стая, която НИКОГА не е засявана, и помни
      # кои са в seed_state.json. Тоест: първият рън праща двата поста,
      # всеки следващ вижда, че няма нищо ново, и мълчи.
      # continue-on-error — това е допълнение към деня, а не самият ден.
      - name: Засей стаите, които още нямат обучителен пост
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          SUPPORT: ${{ vars.SUPPORT || '@green_picks_info_bot' }}
          # GROUP_LINK НЕ се подава: seed_rooms.py не съдържа този низ
          # изобщо (проверено с grep). Мъртва променлива лъже, че
          # управлява нещо — и следващият човек ще я търси половин час.
          SEED_ONLY_NEW: '1'
          # ── РЪЧКИТЕ НА ZDRAVE (02.09.2026). Одит намери 127
          # мъртви ръчки в проекта. Тези бяха мои: обявих ги за
          # лостове в доклад, а нито един работен файл не ги
          # подаваше — значи не работеха.
          # гратис в минути за workflow-и, будени ОТВЪН (не по крон)
          ZDRAVE_GRATIS_VANSHEN: ${{ vars.ZDRAVE_GRATIS_VANSHEN || '60' }}
          # гратис в минути за кроновите; GitHub задушава честите
          ZDRAVE_GRATIS: ${{ vars.ZDRAVE_GRATIS || '720' }}
          # минимален брой лиги, под който здравето вика тревога
          ZDRAVE_LIGA_MIN: ${{ vars.ZDRAVE_LIGA_MIN }}
          # праг за дела юношески карти, над който се вика тревога
          ZDRAVE_YUNOSHESKI: ${{ vars.ZDRAVE_YUNOSHESKI }}
        run: python seed_rooms.py

      # 🩺 ЗДРАВЕН ПРЕГЛЕД. Отговаря на въпроса, който собственикът задава всеки
      # ден: „защо еди-кой си спорт е празен". Пише отговора във файл, който се
      # връща в хранилището — дневникът на Actions не се чете отвън.
      #
      # 🔴 ЧЕРВЕНОТО БЕШЕ УБИТО ДВА ПЪТИ (25.08.2026).
      # Тук стоеше `python zdrave.py 2>&1 | tee zdrave.txt` под continue-on-error.
      # Тръбата връща изхода на ПОСЛЕДНАТА си брънка — tee, който успява винаги.
      # Измерено в bash днес: скрипт с `exit 5` през `| tee` дава изход 0, а със
      # `set -o pipefail` дава 5. Тоест дори без continue-on-error прегледът пак
      # нямаше как да оцвети деня. И двете покрития падат.
      #
      # Изходът вече се ХВАЩА ИЗРИЧНО в `kod` и се подава нататък. Самата стъпка
      # НАРОЧНО не пада: докладът е продукт и трябва да стигне до zdrave.txt и до
      # хранилището точно в дните, когато е пълен с червено. Присъдата е долу,
      # СЛЕД комита — за да не изгуби деня самия доклад, заради който е червен.
      #
      # 🔑 БЕЗ ТОКЕН ПРЕГЛЕДЪТ Е СЛЯП, А СЛЕПОТАТА ИЗЛИЗА С 1.
      # zdrave.py задава 11 въпроса на GitHub (8 workflow-а + 3 файла), а
      # неподписаното питане е 60 на час ЗА ЦЕЛИЯ IP. Измерено живо от тази
      # машина на 25.08.2026: лимит 60, ОСТАВАТ 1. Рънърите на GitHub делят
      # адреси с целия свят. Тоест поправката на тръбата БЕЗ токена щеше да
      # произвежда червено всеки ден заради 403, не заради болен бот.
      # ПЪТ НАЗАД: махаш env блока тук и `actions: read` горе.
      # 🔴 СЕЗОННИЯТ БУДИЛНИК НЯМАШЕ БУДИЛНИК (01.09.2026).
      #
      # sezon.py съществува точно за да каже с ЧИСЛА кога да се махне ключалка
      # от заспал спорт. Одит намери, че НИТО ЕДИН workflow не го пуска:
      #     grep -c "python sezon.py" .github/workflows/*.yml  ->  0 навсякъде
      # zdrave.py взима от него САМО константата OTVARYA — от 24-те му публични
      # функции нула се викат отвън. Тоест мерещият двигател се стигаше само с
      # ръчно пускане, а никой не пуска ръчно всеки ден.
      #
      # ЦЕНАТА, ИЗМЕРЕНА ДНЕС: пуснат на ръка, той веднага отпечата
      #     🔴 ГЪРМИ · ncaaf е в сезон от 29.08, а кошът amfootball е затворен
      # тоест спортът е спал ТРИ ДНИ, докато сезонът вече е течал, и никой не е
      # видял. Плюс два хокейни дефекта за 29.09 (BG_NAME яде прякорите →
      # 4 от 43 мача в първата седмица без цена).
      #
      # ЗАЩО ТУК, А НЕ В predict.yml: прави 19 заявки. Осем пъти на ден е
      # разхищение; веднъж на ден е точно колкото трябва за календар.
      #
      # continue-on-error НАРОЧНО: това е ПОГЛЕД НАПРЕД, не присъда за деня.
      # Календар, който вали дневния бот, ще бъде изключен на втория ден.
      # ПЪТ НАЗАД: махаш тази стъпка — нищо друго не зависи от нея.
      - name: Сезонен будилник — играе ли спорт, който държим заспал
        id: sezon
        continue-on-error: true
        env:
          # 🔴 БЕЗ ТОЗИ РЕД БУДИЛНИКЪТ СЪДИ ПО КОПИЕ (02.09.2026).
          # sezon.py снима PREDICT_IZKL при внасяне; не му ли се подаде,
          # пада на заковано «hockey,amfootball» — подразбирането от
          # 11.08. Амер. футбол беше отворен същия ден, а будилникът
          # продължи да вика «затворен спорт играе» и да връща изход 2.
          # Стойността тук е СЪЩАТА като в predict.yml, за да не се
          # разминат; резервата в sezon.py вече чете и самия yml.
          # 🔴 ЕДНА ИСТИНА ЗА ТРИТЕ ФАЙЛА (02.09.2026). Дотук predict.yml казваше
          # 'hockey', daily.yml 'hockey', а router.yml 'hockey,amfootball' — тоест
          # ботът се държеше различно според това КОЙ го е събудил, и амер.
          # футбол, отворен същия ден, падаше при рутера. Един ключ с три
          # стойности е три различни бота.
          # Празно = нищо не се изключва. Хокеят вече има извор (evrohokey.py),
          # амер. футбол също. ПЪТ НАЗАД: PREDICT_IZKL=hockey,amfootball.
          PREDICT_IZKL: ${{ vars.PREDICT_IZKL || '' }}
        # 🔴 БУДИЛНИКЪТ ЗВЪНЕШЕ В ПРАЗНА СТАЯ (05.09.2026).
        #
        # Тук стоеше голо `python sezon.py`. Стъпката е continue-on-error
        # (нарочно — виж коментара горе), нямаше id и никой не четеше нищо.
        # А sezon.py завършва с `return 2 if (trevoga or v_sezon) else 0`,
        # тоест той ЗНАЕ кога затворен спорт вече играе — и го казваше само
        # на дневника на Actions, който е зад токен.
        #
        # Сега: изходът се хваща в `kod`, текстът отива в sezon.txt (който се
        # комитва долу, както zdrave.txt), и един ред излиза на страницата на
        # ръна. Присъдата на деня НЕ се пипа.
        run: |
          set -o pipefail
          kod=0
          python sezon.py 2>&1 | tee sezon.txt || kod=$?
          echo "kod=$kod" >> "$GITHUB_OUTPUT"
          if [ "$kod" = "2" ]; then
            echo "🔔 СЕЗОНЪТ ЗВЪНИ: затворен спорт вече играе — виж sezon.txt" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🔕 сезонът мълчи (изход $kod) — нищо не чака отваряне" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "sezon.py излезе с $kod (0 = нищо не чака, 2 = има какво да се отвори)"

      - name: Здравен преглед
        id: zdrave
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── РЪЧКИТЕ НА ZDRAVE (02.09.2026). Одит намери 127
          # мъртви ръчки в проекта. Тези бяха мои: обявих ги за
          # лостове в доклад, а нито един работен файл не ги
          # подаваше — значи не работеха.
          # гратис в минути за workflow-и, будени ОТВЪН (не по крон)
          ZDRAVE_GRATIS_VANSHEN: ${{ vars.ZDRAVE_GRATIS_VANSHEN || '60' }}
          # гратис в минути за кроновите; GitHub задушава честите
          ZDRAVE_GRATIS: ${{ vars.ZDRAVE_GRATIS || '720' }}
          # минимален брой лиги, под който здравето вика тревога
          ZDRAVE_LIGA_MIN: ${{ vars.ZDRAVE_LIGA_MIN }}
          # праг за дела юношески карти, над който се вика тревога
          ZDRAVE_YUNOSHESKI: ${{ vars.ZDRAVE_YUNOSHESKI }}
        run: |
          set -o pipefail
          kod=0
          python zdrave.py 2>&1 | tee zdrave.txt || kod=$?
          echo "kod=$kod" >> "$GITHUB_OUTPUT"
          echo "zdrave.py излезе с $kod (0 = чисто, 1 = има какво да се гледа)"

      # ⚠️ ТУК БЕШЕ БЪГЪТ: комитваше се topnews_state.json — файл, който никой не пише.
      #    Затова състоянието никога не оставаше и постовете можеха да се повторят.
      #    Ботът пише daily_state.json — него комитваме.
      # ⚠️ ВТОРИ БЪГ (оправен): старият retry-цикъл държеше commit-а ВЪТРЕ в опита
      #    (commit && pull && push && break) — след първи отхвърлен push всяка
      #    следваща итерация умираше на "nothing to commit", pull/push не се
      #    повтаряха, а стъпката излизаше зелена без комит на remote. Състезанието
      #    е реално: daily бута в 18:00/20:00 UTC, router бута на всеки 10 мин.
      #    Сега: commit ВЕДНЪЖ, после само pull --rebase + push в цикъла, и
      #    провалът е ЧЕРВЕН (exit 1) — същият модел като news/router/predict.
      # seed_state.json Е ЧАСТ ОТ ТОВА. Без връщането му режимът „само новите"
      # губи паметта си заедно с рънъра и праща същите постове пак утре.
      - name: Запази състоянието (daily_state, seed_state, zdrave)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # 🔴 ЕДИН ПО ЕДИН (12.08.2026). `git add a b nyama.json` НЕ добавя
          # НИЩО — git отхвърля целия pathspec, щом един файл липсва, а
          # `|| true` крие изход 128. Проверено в истинско repo: stage-нато
          # остава ПРАЗНО и стъпката излиза ЗЕЛЕНА, без да е запазила нищо.
          # sezon.txt влиза тук по същата причина като zdrave.txt: дневникът
          # на Actions е зад токен, а хранилището се чете.
          for f in daily_state.json seed_state.json zdrave.txt sezon.txt; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Нищо не се е променило — няма какво да пазя."
            exit 0
          fi
          git commit -m "daily state"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then
              pushed=1
              break
            fi
            echo "Push-ът не мина (опит $i) — дърпам и опитвам пак."
            git pull --rebase --autostash || git rebase --abort || true
            sleep $((RANDOM % 6 + 3))
          done
          if [ "$pushed" != "1" ]; then
            echo "ЧЕРВЕНО: daily_state.json НЕ се върна в repo-то."
            echo "Следващият рън може да повтори днешния пост — оправи ръчно."
            exit 1
          fi
          echo "Състоянието е запазено."

      # ⚖️ КОЕ Е ТЕЖКО И КОЕ Е ДРЕБНО (25.08.2026)
      #
      # zdrave.py излиза с 1 при ВСЯКО намерено „за гледане" — и при мъртъв
      # предсказател, и при една лига, разминала се статистически. Пуснат жив
      # днес в 14:32: намира 4 неща, а ВСИЧКИТЕ 8 workflow-а са ✅ зелени.
      # Тоест „изходът стига до workflow-а" в чист вид значи ЧЕРВЕН ДЕН ВСЕКИ
      # ДЕН — а червено всеки ден се чете точно като зелено всеки ден.
      #
      # И не е само въпрос на навик. Прочетено днес в кода:
      #   • pazach.py:112 държи daily.yml в списъка си, а POREDNI по
      #     подразбиране е 2 (pazach.py:86). daily.yml пали ВЕДНЪЖ на ден →
      #     на втория ден пазачът праща тревога в Telegram. И всеки следващ.
      #   • zdrave.py:74 също държи daily.yml, а присъдата му гърми още при
      #     ЕДИН пореден провал (zdrave.py, `if d["poredni"]`). Тоест утре
      #     прегледът щеше да докладва СОБСТВЕНОТО СИ вчерашно червено като
      #     находка и сам да се държи червен. Кръгът се затваря сам.
      #
      # Затова: докладът остава ПЪЛЕН, а денят почервенява САМО от тежкото.
      #   ТЕЖКО  = машина, която трябва да произвежда, не произвежда, и никой
      #            няма да разбере иначе (мъртъв бот, червен/мълчащ workflow,
      #            спорт без карти над собствения си измерен таван, сляп преглед).
      #   ДРЕБНО = число, което иска човек да помисли (калибрация, доходност,
      #            висящи прогнози, една счупена заявка към източник).
      #
      # 🔴 НЕПОЗНАТ РЕД СЕ БРОИ ЗА ТЕЖЪК. Пазач, който ослепее, трябва да ВИКА,
      # не да мълчи. Преименува ли се утре ред в zdrave.py, тук става червено с
      # текста на реда пред очите — вместо тихо зелено. Същото важи и за броя:
      # заглавието казва колко реда има, и той се сверява с колко съм прочел.
      - name: Тежко ли е намереното
        if: always()
        env:
          KOD: ${{ steps.zdrave.outputs.kod }}
        run: |
          TEZHKI=$(printf '%s\n' \
            "черната кутия е от преди" \
            "ПОРЕДНИ провала" \
            "не е успявал от" \
            "НЕ МОГА да прочета кои спортове" \
            "дни без нито една карта" \
            "източникът е празен")
          LEKI=$(printf '%s\n' \
            "://" \
            "чакат резултат" \
            "затворени БЕЗ присъда" \
            "извън шума" \
            "юношески турнири" \
            "надценява се" \
            "филтрите изядоха")

          # Изрежда САМО тежките редове от подхвърлен доклад.
          otsey() {
            sed -n '/ЗА ГЛЕДАНЕ (/,$p' "$1" | grep '^   • ' | while IFS= read -r red; do
              if printf '%s\n' "$red" | grep -qF "$TEZHKI"; then
                printf '%s\n' "$red"
              elif printf '%s\n' "$red" | grep -qF "$LEKI"; then
                :
              else
                printf '%s   <- НЕПОЗНАТ РЕД, затова го броя за тежък\n' "$red"
              fi
            done
            return 0
          }
          # Колко реда ИЗОБЩО има под заглавието. `wc -l` е накрая нарочно:
          # `grep -c` връща 1 при нула съвпадения и `set -e` би убил стъпката.
          broi() {
            sed -n '/ЗА ГЛЕДАНЕ (/,$p' "$1" | grep '^   • ' | wc -l | tr -d ' '
          }

          # 🧪 ПРОБА НА САМИЯ КЛАСИФИКАТОР — всеки ден, ПРЕДИ присъдата.
          # Подхвърля се измислен доклад и се гледа ИЗХОДЪТ, не текстът.
          # Падне ли, денят е червен с обяснение — вместо пазачът да замлъкне.
          proba=$(mktemp)
          printf '%s\n' \
            "🔴 ЗА ГЛЕДАНЕ (3):" \
            "   • predict.yml (предсказателят пуска карти): 2 ПОРЕДНИ провала" \
            "   • 5 прогнози от МИНАЛИ дни още чакат резултат (…)" \
            "   • нещо съвсем ново, за което тази стъпка не знае" > "$proba"
          n=$(otsey "$proba" | wc -l | tr -d ' ')
          b=$(broi "$proba")
          # 🔴 ТРЕТОТО ЧИСЛО НЕ Е ИЗЛИШНО (измерено, 25.08.2026).
          # Първата версия на пробата гледаше само `n` и `b` — и ОЦЕЛЯ, когато
          # нарочно махнах иглата „ПОРЕДНИ провала". Причината: редът тогава
          # не съвпада с нищо, пада в клона „непознат" и пак се брои за тежък.
          # Тоест пробата мереше тръбата, не иглите. `nz` ги разделя: познатият
          # тежък ред НЕ БИВА да носи белега „НЕПОЗНАТ", а измисленият — да.
          nz=$(otsey "$proba" | grep 'НЕПОЗНАТ РЕД' | wc -l | tr -d ' ')
          rm -f "$proba"
          if [ "$n" != "2" ] || [ "$b" != "3" ] || [ "$nz" != "1" ]; then
            echo "🔴 ЧЕРВЕНО: класификаторът тук не работи."
            echo "   Подхвърлих 3 реда (1 познат тежък, 1 познат лек, 1 непознат)."
            echo "   Очаквах 2 тежки · 3 прочетени · 1 непознат;"
            echo "   получих $n · $b · $nz."
            echo "   Най-вероятно иглите му са остарели спрямо zdrave.py."
            exit 1
          fi

          # `always()` е НАРОЧНО голо, без `&& steps.zdrave.outputs.kod != ''`.
          # Такова условие би изглеждало по-чисто, но махне ли някой утре реда
          # `id: zdrave`, изразът става празен и тази стъпка спира да се пуска
          # ТИХО. Пазач, който умира без звук, е по-лош от липсващ пазач.
          # Затова условието е голо, а липсата се хваща тук, НА ГЛАС.
          if [ -z "${KOD:-}" ]; then
            echo "🔴 ЧЕРВЕНО: нямам изход от прегледа. Или предишна стъпка е"
            echo "   паднала и той изобщо не е тръгвал, или «id: zdrave» е"
            echo "   махнат. И в двата случая днес НИКОЙ не е гледал здравето."
            exit 1
          fi
          if [ ! -s zdrave.txt ]; then
            echo "🔴 ЧЕРВЕНО: zdrave.txt е празен — прегледът не произведе нищо."
            exit 1
          fi
          # Присъдата на zdrave.py е точно едно от трите изречения. Няма ли
          # нито едно, значи е гръмнал по средата — това НЕ е „чисто".
          if ! grep -qF -e "ЗА ГЛЕДАНЕ (" -e "НЯМА НАМЕРЕНИ ПРОБЛЕМИ" -e "ЧИСТО ПО ТОВА" zdrave.txt; then
            echo "🔴 ЧЕРВЕНО: прегледът НЕ СТИГНА до присъда. Последните редове:"
            tail -n 15 zdrave.txt
            exit 1
          fi
          case "$KOD" in
            0|1) ;;
            *) echo "🔴 ЧЕРВЕНО: zdrave.py излезе с $KOD — това не е нито"
               echo "   «чисто» (0), нито «намерих нещо» (1). Гръмнал е."
               exit 1 ;;
          esac

          # Заглавието казва колко реда следват. Разминат ли се с прочетените,
          # форматът е сменен и този пазач чете празно — тоест е СЛЯП.
          obyaven=$(grep -o 'ЗА ГЛЕДАНЕ ([0-9]*)' zdrave.txt | head -1 | tr -dc '0-9')
          obyaven=${obyaven:-0}
          vidyani=$(broi zdrave.txt)
          if [ "$obyaven" != "$vidyani" ]; then
            echo "🔴 ЧЕРВЕНО: докладът обявява $obyaven реда, а прочетох $vidyani."
            echo "   Форматът на zdrave.py се е сменил — тази стъпка чете празно."
            exit 1
          fi

          # Слепота: 11 въпроса се задават на GitHub. Един неотговорен е трошка,
          # пет и повече значат, че прегледът е гледал в стената.
          slepi=$(grep -o 'НЕ МОЖАХ ДА ПРОВЕРЯ ([0-9]*)' zdrave.txt | head -1 | tr -dc '0-9')
          slepi=${slepi:-0}
          if [ "$slepi" -ge 5 ]; then
            echo "🔴 ЧЕРВЕНО: $slepi неща останаха НЕПРОВЕРЕНИ от 11 питания."
            echo "   Това не е «чисто», а сляп преглед — най-често 403 от GitHub."
            exit 1
          fi

          # 🔴 КЛЮЧАЛКАТА (измерена живо 01.09.2026, вече 6 поредни провала).
          # zdrave пише «daily.yml: N ПОРЕДНИ провала»; редът е в TEZHKI;
          # стъпката излиза 1; daily.yml пак е червен; утре пише N+1.
          # Веднъж почервенял, workflow-ът се държи червен ОТ СОБСТВЕНАТА СИ
          # диагноза — и никоя чужда поправка не може да го върне в зелено.
          # Броенето расте само: 5 на 31.08, 6 на 01.09.
          #
          # Лекът НЕ Е заглушаване: редът се печата ЦЯЛ, както преди. Лекът
          # е присъдата да не се произнася ПО СЕБЕ СИ. Изчистят ли се другите
          # находки, денят става зелен, броячът на GitHub се нулира сам и
          # редът изчезва — без никой да го е скривал.
          #
          # ⚠ Другите ЧЕТИРИ изхода на тази стъпка (пробата на класификатора,
          # липсващият KOD, слепотата, разминатият брой) са ПРЕДИ този блок и
          # НЕ минават оттук. Истинска авария на daily.yml пак е ЧЕРВЕНА.
          tezhki=$(otsey zdrave.txt)
          if [ -n "$tezhki" ]; then
            # `|| true`, защото grep без съвпадение връща 1, а `set -e` убива.
            chuzhdi=$(printf '%s\n' "$tezhki" | grep -v '^   • daily\.yml' || true)
            echo "🔴 ТЕЖКО:"
            printf '%s\n' "$tezhki"
            echo ""
            echo "Пълният доклад е в zdrave.txt в хранилището."
            if [ -n "$chuzhdi" ]; then
              echo "Денят е ЧЕРВЕН заради редовете, които НЕ са за daily.yml."
              exit 1
            fi
            echo "ℹ️ Всичко тежко горе е за САМИЯ daily.yml, затова НЕ се"
            echo "   самоосъждам: червено тук утре пише «+1 пореден провал»"
            echo "   и ключалката се самозахранва. Всичко останало е чисто."
            exit 0
          fi
          echo "✅ Нищо тежко. Дребни бележки: $vidyani · непроверени: $slepi."
          echo "   Пълният доклад е в zdrave.txt в хранилището."

name: hub (подреждане на канала и стаите)

# ─────────────────────────────────────────────────────────────────────────────
# Пуска setup_hub.py — той НЕ трие нищо. Само пише наново закачените постове.
#
#   hub    → един закачен пост в КАНАЛА: какво тече тук и накъде да върви човек
#   rooms  → закачен пост във ВСЯКА стая (откачва стария, закача новия),
#            включително 328 „Бойни спортове", плюс съпорт-поста в стая 11
#   diag   → НИЩО НЕ ПИПА. Само пита Telegram свързани ли са каналът и групата.
#            Отговаря на въпроса „защо добавен в канала човек не влиза в стаите":
#            те са два различни чата и се свързват само през „дискусионна група".
#   all    → и трите
#
# Това е инструментът за „искам всички стаи организирани". За разлика от
# reset.yml тук нищо не се изтрива — само пиновете се пренаписват.
#
# ЗАЩО ИМА РЕЗЕРВНИ НОМЕРА ПО-ДОЛУ
# Незададена променлива в GitHub идва като ПРАЗЕН НИЗ, а празният низ бие
# подразбиращата се стойност в скрипта. Без резервата тук режимът rooms
# минаваше мълчаливо и не подреждаше нито една стая — тихият провал е
# по-лош от шумния.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Какво да подредя'
        default: 'rooms'
        type: choice
        options: [diag, rooms, hub, all]

# contents: write — НЕ е разкош. setup_hub.py помни в hub_state.json кой пост
# в коя стая е сложил. Без връщане на този файл в хранилището паметта умира с
# рънъра и всяко следващо пускане пише НОВ пост във всяка стая — точно
# дублиращите се закачени съобщения, от които собственикът се оплака.
permissions:
  contents: write

concurrency:
  group: hub-setup
  cancel-in-progress: false

jobs:
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Подреди
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          HUB_MODE: ${{ github.event.inputs.mode }}
        run: python setup_hub.py

      # Паметта се връща в хранилището. Без този ред следващото пускане не
      # знае какво вече е сложило и трупа втори комплект постове.
      - name: Запомни кой пост къде е
        if: always()
        run: |
          git config user.name "greenpicks-bot"
          git config user.email "bot@greenpicks"
          git add hub_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Паметта е без промяна."
            exit 0
          fi
          git commit -m "hub state"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then
              pushed=1
              break
            fi
            echo "Push-ът не мина (опит $i) — дърпам и опитвам пак."
            git pull --rebase --autostash || git rebase --abort || true
            sleep $((RANDOM % 6 + 3))
          done
          if [ "$pushed" != "1" ]; then
            echo "ЧЕРВЕНО: паметта НЕ се върна — следващото пускане ще дублира."
            exit 1
          fi
          echo "Паметта е запазена."

name: news-bot
on:
  schedule:
    # GitHub cron е ВИНАГИ UTC. Долу е ЛЯТНОТО време (BG = UTC+3); зимата всеки ред пада с един час български.
    # ВСИЧКО СВЪРШВА ДО 22:00 БГ (поръчка на собственика, 05.08.2026).
    # Вечерният крон е свален от 22:00 на 20:00, защото GitHub закъснява —
    # мерено на живо, крон за 07:00 тръгна в 07:48.
    - cron: '0 5 * * *'     # 08:00 BG (лято)
    - cron: '0 11 * * *'    # 14:00 BG (лято)
    - cron: '0 17 * * *'    # 20:00 BG (лято)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Първо пълнене: колко дни назад да се вземат новини (празно = нормален прозорец)'
        required: false
        default: ''

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Пълна история, за да може rebase-ът долу да работи спокойно.
          fetch-depth: 0
      # 🔴 ДОБАВЕНО 12.08.2026. checkout@v4 сваля github.sha — върха от мига, в
      # който рънът е СЪЗДАДЕН, не когато е тръгнал. Concurrency групата държи
      # рънове да чакат; измерено върху 424 ръна, 39 (9.2%) са създадени,
      # докато друг от групата върви. Тоест работният файл може да е отпреди
      # чуждото писане — и state-ът се презаписва със стар.
      - name: Дръпни последното (checkout-ът може да е застоял)
        run: git pull --ff-only origin ${{ github.ref_name }} || echo "не превъртя чисто — карам с това, което имам"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 🔴 ПОРТИЕРЪТ ЛИПСВАШЕ (добавен 11.08.2026).
      #
      # news_bot.py има 155 самопроверки — най-много след предсказателя. Те не
      # са се пускали в GitHub НИТО ВЕДНЪЖ: този работен файл минаваше направо
      # на `python news_bot.py`. Всеки друг бот в проекта има портиер пред себе
      # си (daily, dedupe, hub, matches, predict, rooms, score, support) —
      # новинарят беше единственият без.
      #
      # А новините отиват при хора: счупен подбор значи английски боклук или
      # хазартен източник в стая 26, видян от всички, преди някой да разбере.
      - name: Самопроверка на новинаря
        run: python news_bot.py --selftest

      - name: Run news bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # Резервните стойности НЕ са излишни: незададена променлива в GitHub
          # идва като празен низ и празният низ бие подразбиращото се в скрипта.
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          # 🔴 ЛИПСВАШЕ (11.08.2026). news_bot.py ред 2042 има пазач:
          #     if CHANNEL_ID and str(CHAT_ID) == str(CHANNEL_ID): СТОП
          # Без подаден CHANNEL_ID първото условие е ВИНАГИ False и пазачът
          # срещу „новини в канала" не можеше да гръмне НИКОГА. Написан,
          # качен и изключен. Оценителят, рутерът и чистачът го получават —
          # новинарят, единственият, който би сгрешил, не го получаваше.
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          NEWS_THREAD_ID: ${{ vars.NEWS_THREAD_ID || '26' }}
          # Само при ръчно пускане с попълнено поле — кроновете идват празни.
          NEWS_BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: python news_bot.py
      # Ботът пише ТОЧНО тези два файла (STATE_FILE/TITLES_FILE в news_bot.py):
      # sent_news.json (памет срещу дублирани карти) и last_news_titles.json
      # (мостът към matches_bot). Загубен push = дублирани новини на следващия рън.
      - name: Запази news state
        if: always()
        run: |
          git config user.name "greenpicks-bot"
          git config user.email "bot@greenpicks"
          # 🔴 ЕДИН ПО ЕДИН (12.08.2026). `git add a b nyama.json` НЕ добавя
          # НИЩО — git отхвърля целия pathspec, щом един файл липсва, а
          # `|| true` крие изход 128. Проверено в истинско repo: stage-нато
          # остава ПРАЗНО и стъпката излиза ЗЕЛЕНА, без да е запазила нищо.
          for f in sent_news.json last_news_titles.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Състоянието е без промяна — няма какво да се връща."
            exit 0
          fi
          git commit -m "news state"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then
              pushed=1
              break
            fi
            echo "Push-ът не мина (опит $i) — дърпам и опитвам пак."
            git pull --rebase --autostash || git rebase --abort || true
            sleep $((RANDOM % 6 + 3))
          done
          if [ "$pushed" != "1" ]; then
            echo "ЧЕРВЕНО: състоянието НЕ се върна в repo-то."
            echo "Следващото пускане ще повтори днешните новини — оправи ръчно."
            exit 1
          fi
          echo "Състоянието е запазено."

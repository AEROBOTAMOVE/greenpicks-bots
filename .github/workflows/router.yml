name: router-bot
on:
  schedule:
    - cron: '*/10 * * * *'   # на всеки 10 минути — постовете хвърчат по стаите
  workflow_dispatch: {}

concurrency:
  # 🔴 ЕДНА ГРУПА С ПРЕДСКАЗАТЕЛЯ, ОЦЕНИТЕЛЯ И СЪПОРТА (11.08.2026).
  # Опашката на Telegram е ЕДНА на бот. От днес рутерът се пуска и вътре в
  # predict.yml (осем сигурни пускания на ден срещу 6% попадение тук).
  # Общата група е това, което пази двата да не четат опашката едновременно —
  # без нея един и същ пост щеше да влезе два пъти в стаите.
  # Мерено и второ основание: рутерът и съпортът се засичаха 39 пъти за 7 дни
  # в рамките на 3 минути, а и двамата пишат support_state.json.
  group: greenpicks-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Пълна история, за да може rebase-ът долу да работи спокойно.
          fetch-depth: 0

      # 🔴 ДОБАВЕНО 12.08.2026. checkout@v4 сваля github.sha — върха от мига,
      # в който рънът е СЪЗДАДЕН, не когато е тръгнал. Concurrency групата
      # държи рутера да чака предсказателя; измерено върху 424 ръна, 39 (9.2%)
      # са създадени, докато друг от групата върви. Тоест рутерът чете тефтер
      # ОТПРЕДИ чуждото писане: будилникът вижда стар час, буди напразно, а
      # предсказателят зарежда стар „posted" и праща същите карти пак.
      # --ff-only: ако не може да превърти чисто, спираме, вместо да гадаем.
      - name: Дръпни последното (checkout-ът може да е застоял)
        run: git pull --ff-only origin ${{ github.ref_name }} || echo "не превъртя чисто — карам с това, което имам"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 🔴 ДОБАВЕНО 11.08.2026. Рутерът беше ЕДИНСТВЕНИЯТ жив бот без
      # самопроверка — и точно затова разделянето „стая 9 = статистика /
      # стая 10 = фишове" му се размина цял ден, докато всички останали
      # ботове го получиха. Портиер: счупен ли е разборът на стаите, спираме
      # ТУК, вместо да разнесем постовете по грешни стаи. Не пипа мрежа.
      # 🔴 ДОБАВЕНО 12.08.2026. Будилникът пуска predictor.py, а той дърпа
      # тениса на маса от CDN, който ВИНАГИ отговаря с Content-Encoding: br.
      # Без модула спортът мълчи. Измерено, два сухи рънa един след друг:
      # без brotli 0 срещи, с brotli 12. predict.yml го инсталира отдавна;
      # рутерът щеше да буди по слепия път — и точно той поема сутрешната
      # дупка, тоест ПЪРВАТА карта на деня всеки ден.
      - name: Модулът за тениса на маса
        run: python -m pip install --quiet --disable-pip-version-check brotli

      # 🔴 ТУК САМО ДОКЛАДВА, НЕ СПИРА (21.08.2026).
      #
      # В предсказателя и оценителя цялостта е ПОРТИЕР: липсва ли защита,
      # по-добре мълчание, отколкото крива карта. Тук обаче спирането е
      # КАСКАДА — рутерът разнася опашката на Telegram, обслужва съпорта И
      # носи будилника. Падне ли, предсказателят не се буди изобщо и целият
      # бот замлъква заради едно липсващо име.
      #
      # Затова: вижда се в дневника, но не спира нищо. Гейтът е другаде.
      - name: Цялост — всичко ли е тук (само доклад)
        continue-on-error: true
        run: python cyalost.py

      - name: Самопроверка на рутера
        run: python router_bot.py --selftest

      # Будилникът може да пусне предсказателя — значи и неговият
      # портиер трябва да мине ТУК, не само в predict.yml.
      - name: Самопроверка на будилника и предсказателя
        run: |
          python budilnik.py --selftest
          python predictor.py selftest

      - name: Разнеси постовете И обслужи въпросите
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # Резервните стойности НЕ са излишни: незададена променлива в GitHub
          # идва като празен низ и празният низ бие подразбиращото се в скрипта
          # (router_bot.py:38). С празен CHANNEL_ID филтърът по канал (ред 143)
          # не хваща НИЩО, а offset-ът върви напред — пропуснатите канал-постове
          # се губят тихо и безвъзвратно. Това беше единственият workflow по
          # разписание с голи vars.* — вече не е.
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          # ⚠️ ТОЗИ РЪН Е ЕДИНСТВЕНИЯТ ЧЕТЕЦ НА ОПАШКАТА (от 29.07.2026).
          # Опашката на Telegram е ЕДНА на бот. Докато рутерът и съпортът се
          # пускаха поотделно и си отстъпваха учтиво, съпортът се блъскаше в
          # първия пост от канала и offset-ът му остана НУЛА — човек писа на
          # бота в 18:00 и не получи отговор. Сега рутерът обслужва и личните
          # съобщения на място, а support.yml е с SUPPORT_POLLING=0.
          # Затова тук трябват и променливите на съпорта:
          SUPPORT_THREAD_ID: ${{ vars.SUPPORT_THREAD_ID || '11' }}
          # 🔴 БЛИЗНАКЪТ НА ВЕЧЕ ОПРАВЕНИЯ COMBAT_THREAD_ID (11.08.2026).
          # Тези пет номера се четат от predictor.py, matches_bot.py И
          # router_bot.py — и не идваха от НИТО ЕДИН workflow. Живееха на
          # заковани резерви 5/6/7/8/4. Смени ли се стая, трите бота щяха да
          # пишат в старата без нито един ред грешка. Точно сценарият, който
          # коментарът за бойните спортове описва — само че на пет места.
          FOOTBALL_THREAD_ID: ${{ vars.FOOTBALL_THREAD_ID || '5' }}
          BASKET_THREAD_ID: ${{ vars.BASKET_THREAD_ID || '6' }}
          TT_THREAD_ID: ${{ vars.TT_THREAD_ID || '7' }}
          VOLLEY_THREAD_ID: ${{ vars.VOLLEY_THREAD_ID || '8' }}
          PICKS_THREAD_ID: ${{ vars.PICKS_THREAD_ID || '4' }}
          RESULTS_THREAD_ID: ${{ vars.RESULTS_THREAD_ID || '9' }}
          WINS_THREAD_ID: ${{ vars.WINS_THREAD_ID || '10' }}
          ADMIN_CHAT_ID: ${{ vars.ADMIN_CHAT_ID }}
          # Кой има право да отговаря на хората през бота.
          # ПРАЗНО Е НОРМАЛНО: съпортът сам пита Telegram кои са админите на
          # групата и ги приема за свой екип (кеш 6 часа). Тази променлива е
          # само за човек, който помага, но НЕ е админ на групата.
          # Преди този ред списъкът беше празен и всеки опит за отговор
          # получаваше „релето е изключено" — ботът приемаше въпроси, а екипът
          # нямаше как да отговори.
          SUPPORT_ADMIN_IDS: ${{ vars.SUPPORT_ADMIN_IDS }}
          SUPPORT: ${{ vars.SUPPORT }}
          SUPPORT_FAQ_URL: ${{ vars.SUPPORT_FAQ_URL }}
        run: python router_bot.py
      # Изгубен push = изгубен offset = дублирани постове по стаите.
      # ══════════════════════════════════════════════════════════════
      #  ⏰ БУДИЛНИКЪТ (12.08.2026) — външна услуга НЕ Е НУЖНА
      #
      #  Кронът на GitHub закъснява средно 65 минути, а на 06.08 ПРОПУСНА пет
      #  от осем пускания на предсказателя. Празна стая, нула червени рънове,
      #  никой не е сгрешил.
      #
      #  Обичайният лек е външен будилник (cron-job.org), но той иска GitHub
      #  токен, въведен на ръка в поле. Тук същото се прави без нито един ключ:
      #  рутерът е в СЪЩАТА concurrency група като предсказателя — тоест може
      #  да го събуди, без да се блъскат.
      #
      #  КОЛКО ЧЕСТО НАИСТИНА: разписанието е */10, но GitHub го спазва рядко.
      #  Измерено за 21 дни: 6.5 ръна на ден, медианна пауза 74 минути, нула
      #  паузи под 15 мин. Тоест резолюцията е около час, не десет минути —
      #  и точно затова спирачката от 30 мин на практика не се задейства.
      #
      #  budilnik.py чете кога предсказателят е пускал за последно и решава.
      #  Работни часове 8-22 (сверени с RUN_HOURS в самия predictor), таван 90
      #  минути. Фалшиво будене е евтино: предсказателят помни какво вече е
      #  пуснал и има дневен таван — дубли не излизат.
      # 🔴 И ОЦЕНИТЕЛЯТ ОТ ДНЕС (25.08.2026). Знамето се вдига САМО ТУК.
      # budilnik.py се вика и от support.yml, но там НЯМА стъпка, която да
      # изпълни решението. Вдигне ли се знамето и там, будилникът щеше да
      # отбелязва опити, които никой не изпълнява, да изчерпва тавана — и
      # рутерът щеше да мълчи. Пазач, който създава пропусната тревога, вече
      # ни е горял веднъж.
      #
      # 🔴 ПЪТЯТ НАЗАД, ПРЕДИ ДЕЙСТВИЕТО: смени '1' на '0' (или махни двата
      # реда env). Целият будилник за оценителя става мъртъв: изходът
      # ocenitel е винаги 0, стъпката „Събуди оценителя" не се пуска, в
      # тефтера не се пише нищо. Един ред, без пипане на код.
      - name: Проспа ли предсказателя или оценителя
        id: budilnik
        env:
          BUDILNIK_OCENITEL: '1'
        run: python budilnik.py

      - name: Събуди предсказателя
        if: steps.budilnik.outputs.budim == '1'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # Резервните стойности НЕ са излишни: незададена променлива в GitHub
          # идва като празен низ и празният низ бие подразбиращото се в скрипта.
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          PREDICT_THREAD_ID: '27'
          # Незадължителни ключове — ако ги няма, идват празни и ботът кара
          # с TheSportsDB тест-ключа. Нищо не се чупи.
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY || vars.SPORTSDB_KEY }}
          # Настройки на модела — празна стойност = вътрешната подразбираща се.
          MAX_PICKS: ${{ vars.MAX_PICKS }}
          PREDICT_POOL: ${{ vars.PREDICT_POOL }}
          PREDICT_PER_SPORT: ${{ vars.PREDICT_PER_SPORT }}
          PREDICT_MIN_STRENGTH: ${{ vars.PREDICT_MIN_STRENGTH }}
          # 🔴 ОТКОВАНО 11.08.2026. Тук стоеше твърдо '18'. Списъкът в кода
          # порасна на 21: добавени бяха квалификациите за Лига Европа и за
          # Лигата на конференциите. Измерено на живо същия ден — на 13 август
          # тези два адреса дават 12 и 25 мача, а основните им (без _qual) са
          # празни през целия август. Числото 18 щеше да отреже точно тях.
          # Празна стойност = кодът пита ЦЕЛИЯ списък, какъвто и да стане утре.
          PREDICT_FOOT_SLUGS: ${{ vars.PREDICT_FOOT_SLUGS }}
          # 🔴 ДОБАВЕНО 11.08.2026. matches.yml подава COMBAT_THREAD_ID от vars,
          # а predict.yml не го подаваше — а двата бота четат СЪЩАТА променлива.
          # Смени ли се, боевете отиват в новата стая, а ММА-картите остават в
          # 328: две стаи, нито един ред грешка в лога.
          COMBAT_THREAD_ID: ${{ vars.COMBAT_THREAD_ID || '328' }}
          # 🔴 БЛИЗНАКЪТ НА ВЕЧЕ ОПРАВЕНИЯ COMBAT_THREAD_ID (11.08.2026).
          # Тези пет номера се четат от predictor.py, matches_bot.py И
          # router_bot.py — и не идваха от НИТО ЕДИН workflow. Живееха на
          # заковани резерви 5/6/7/8/4. Смени ли се стая, трите бота щяха да
          # пишат в старата без нито един ред грешка. Точно сценарият, който
          # коментарът за бойните спортове описва — само че на пет места.
          FOOTBALL_THREAD_ID: ${{ vars.FOOTBALL_THREAD_ID || '5' }}
          BASKET_THREAD_ID: ${{ vars.BASKET_THREAD_ID || '6' }}
          TT_THREAD_ID: ${{ vars.TT_THREAD_ID || '7' }}
          VOLLEY_THREAD_ID: ${{ vars.VOLLEY_THREAD_ID || '8' }}
          PICKS_THREAD_ID: ${{ vars.PICKS_THREAD_ID || '4' }}
          # Квота за спорт: 1 = всеки спорт с кандидат получава поне една карта
          # (без нея ММА не влизаше НИКОГА — звездите му са заковани на една).
          # 0 връща старото поведение, без пипане на код.
          PREDICT_KVOTA: ${{ vars.PREDICT_KVOTA }}
          # Пазачите на разписанието (по подразбиране 10 / 30 / 10):
          #   MAX_DAY    таван прогнози за ЦЕЛИЯ ден, за да не залее стаята
          #   HORIZON_H  докъде напред гледаме — далечният мач чака своя час
          #   LEAD_MIN   колко минути преди начало спираме да пускаме карта
          PREDICT_MAX_DAY: ${{ vars.PREDICT_MAX_DAY }}
          # 🔴 КЛЮЧАЛКИТЕ НА СПЯЩИТЕ СПОРТОВЕ (01.09.2026).
          #
          # Дотук тези пет променливи НЕ СЕ ПОДАВАХА изобщо — тоест
          # ключалките в predictor.py бяха недостижими отвън и амер.
          # футболът остана на нула карти, макар NCAA да отвори на 29.08.
          #
          # ВСЯКА Е С РЕЗЕРВА, и това не е украса: незададена променлива в
          # GitHub идва като ПРАЗЕН НИЗ, а празният низ БИЕ подразбиращото
          # се в скрипта. Без `|| ...` празният PREDICT_IZKL би отворил
          # хокея И амер. футбола ВЕДНАГА, без никой да е поискал.
          # Резервите са равни на днешното поведение: нищо не се мени,
          # докато собственикът не сложи стойност.
          #
          #   PREDICT_IZKL          кои спортове мълчат.
          #                         „hockey" пуска амер. футбола.
          #                         „" пуска всичко (внимателно).
          #   PREDICT_AMFUTBOL_MAX  карти на пускане за амер. футбол (0 = спи)
          #   PREDICT_BOKS_MAX      същото за бокса. ❗ Боксът НЯМА кой да
          #                         го отсъди — карта без присъда виси вечно.
          #   PREDICT_ESPORT_MAX    същото за електронните спортове.
          #   PREDICT_STAYA_REZHIM  pak (както днес) · kratko (един ред в
          #                         стаята на спорта) · bez (само в канала)
          PREDICT_IZKL: ${{ vars.PREDICT_IZKL || 'hockey,amfootball' }}
          PREDICT_AMFUTBOL_MAX: ${{ vars.PREDICT_AMFUTBOL_MAX || '0' }}
          PREDICT_BOKS_MAX: ${{ vars.PREDICT_BOKS_MAX || '0' }}
          # 🎮 ЕСПОРТЪТ СЕ БУДИ — САМО CS2 (01.09.2026).
          #
          # Вратата за резултати е НАМЕРЕНА и ИЗМЕРЕНА: Smarkets дава
          # победителя ПОИМЕННО, без ключ и без преправен подпис.
          #   api.smarkets.com/v3/markets/{id}/contracts/ → 200
          #   {"name":"Team WE","state_or_outcome":"winner"}
          #
          # ПОКРИТИЕТО Е РАЗЛИЧНО ПО ИГРА, измерено на живо:
          #   CS2     37 мача на 31.08, 36 с победител  →  97%
          #   Dota 2   4 мача,           4 с победител  → 100%
          #   LoL      5 от 15                          →  33%  ← НЕ
          #   Valorant Smarkets няма такъв тип събитие  →   0%  ← НЕ
          # Целият кръг, изпитан на десет истински вчерашни мача:
          #   10 от 10 = 100% (вкл. G2 срещу Natus Vincere → G2)
          #
          # 🔴 ЗАТОВА САМО CS2. Карта без път до присъда виси вечно и
          # трови процента на целия спорт — урокът от ITF. LoL и
          # Valorant влизат, когато и за тях има извор.
          #
          # НАЗАД: PREDICT_ESPORT_MAX=0 и спортът заспива.
          PREDICT_ESPORT_MAX: ${{ vars.PREDICT_ESPORT_MAX || '3' }}
          PREDICT_ESPORT_IGRI: ${{ vars.PREDICT_ESPORT_IGRI || 'cs2' }}
          PREDICT_STAYA_REZHIM: ${{ vars.PREDICT_STAYA_REZHIM || 'pak' }}
          # 💰 ЦЕНАТА И ЛИНКЪТ НА КАРТАТА (01.09.2026).
          #
          # ВКЛЮЧЕНИ ПО ИЗРИЧНО РЕШЕНИЕ НА СОБСТВЕНИКА: „да пускай цените на
          # картите и линкове давай на макс". Той е искал това и по-рано —
          # записано е в predictor.py ред 5754 — и тогава е било отказано.
          # Сега решението е негово и е взето.
          #
          #   PAZAR_IZTOCHNIK=1  →  „📊 Пазар: 1.85 (ESPN)"
          #   PAZAR_LINK=1       →  добавя адрес на САМИЯ мач
          #
          # СПИРА СЕ С ПРОМЕНЛИВА, БЕЗ ПИПАНЕ НА КОД: сложи 0 в GitHub.
          #
          # 🔴 ДВЕ НЕЩА, ИЗМЕРЕНИ И ЗАПИСАНИ ТУК, ЗА ДА НЕ СЕ ЗАБРАВЯТ:
          # 1. Линкът работи САМО за футбол, бейзбол и баскетбол — 244 от
          #    1082 карти (22.6%). Другите спортове нямат ESPN номер по
          #    устройство. Проверено с истински срещу измислен номер: 200
          #    срещу 404. Pinnacle адресите НЕ СА доказуеми — сайтът им
          #    връща същите 14258 байта за истински номер, за нула и за
          #    безсмислица, тоест 200 там не доказва нищо.
          # 2. Самата ESPN страница, към която води линкът, съдържа
          #    „draftkings" 51 пъти, „odds" 97 и „bet365" 2. Нашият ред е
          #    чист, но адресът води при тях. Собственикът го знае.
          PAZAR_IZTOCHNIK: ${{ vars.PAZAR_IZTOCHNIK || '1' }}
          PAZAR_LINK: ${{ vars.PAZAR_LINK || '1' }}
          PREDICT_HORIZON_H: ${{ vars.PREDICT_HORIZON_H }}
          PREDICT_LEAD_MIN: ${{ vars.PREDICT_LEAD_MIN }}
        run: python predictor.py

      # ══════════════════════════════════════════════════════════════
      #  ⏰ БУДИЛНИК И ЗА ОЦЕНИТЕЛЯ (25.08.2026)
      #
      #  ПОВОДЪТ, ДОСЛОВНО: „СЧУПИ СЕ РЕЗУЛТАТИ И СТАТИСТИКА КАНАЛ СПРЯ ДА
      #  ГИ ДАВА". Измерено през api.github.com същия ден — 56 планови ръна
      #  на score.yml от 29.07 до 25.08, всеки отнесен към най-близкия план:
      #
      #     план 13:30 БГ  n=27  закъснение медиана 41 · 90-и 329 · макс 415
      #     план 22:30 БГ  n=28  закъснение медиана 40 · 90-и 171 · макс 546
      #     планове без НИТО ЕДИН рън: 0 от 55
      #     ПРОВАЛИ: 15 от 56 (27%), три от последните пет
      #
      #  Тоест — за разлика от предсказателя — кронът на оценителя НЕ
      #  ПРОПУСКА, а ЗАКЪСНЯВА и ПАДА. Затова тук няма правило „пропуснат
      #  час": има два прозореца (14:15-19:59 и 23:15-04:59, по 45 мин след
      #  плановете) и таван 2 опита на прозорец.
      #
      #  🔴 БЕЗ ПАЗАЧА В scorer.py ТАЗИ СТЪПКА НЕ СЕ ПУСКА ИЗОБЩО.
      #  Оценителят няма марка за пратено съобщение: всяко вечерно пускане
      #  праща „ФИНИШ НА ДЕНЯ" в стая 9 И в канала плюс „ДОСЕГА ОБЩО" в стая
      #  9, без нито една проверка дали същият текст вече е излизал.
      #  Измерено офлайн: пет вечерни пускания = 15 съобщения, 12 от тях
      #  дословни повторения. С пазача: 3 съобщения, нула повторения.
      #
      #  Затова budilnik.py има ПОРТИЕР (pazachat_e_v_scorera): чете живия
      #  scorer.py и буди само ако вратата prati_ravnosmetka наистина е там.
      #  Дотогава в лога стои „НЕ будя, за да не залея канала" и изходът
      #  ocenitel е 0 — тоест ЗЕЛЕН рън, който нищо не праща. Сложи ли се
      #  krapka_scorer_pazach.py, будилникът се включва САМ, без да се пипа
      #  нито ред тук. Аварийно заобикаляне: BUDILNIK_OC_BEZ_PAZACH=1.
      #
      #  Таванът остава 2 опита на прозорец (BUDILNIK_OC_TAVAN).
      #
      #  ПОРТИЕРЪТ Е ВЪТРЕ В СТЪПКАТА, НЕ ГОРЕ. Рутерът върви ~40 пъти на
      #  ден, а буди оценителя най-много два пъти: цялостта и 402-те
      #  самопроверки на оценителя горе биха се плащали на всеки рън за
      #  нищо. Същият ред е и при стените по-долу. Гейтът не е махнат, само
      #  преместен там, където има какво да пази — и е БЛОКИРАЩ, точно както
      #  в score.yml: по-добре никакъв отчет, отколкото отчет, който брои
      #  грешно.
      #
      #  ЦЕНАТА ВЪВ ВРЕМЕ (измерено, 47 успешни ръна на score.yml):
      #  медиана 0.9 мин · 90-и 2.0 · макс 6.8. Таванът на job-а е 25 мин.
      - name: Събуди оценителя
        if: steps.budilnik.outputs.ocenitel == '1'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # Резервните стойности НЕ са излишни: незададена променлива в GitHub
          # идва като празен низ и празният низ бие подразбиращото се в скрипта.
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          RESULTS_THREAD_ID: ${{ vars.RESULTS_THREAD_ID || '9' }}
          WINS_THREAD_ID: ${{ vars.WINS_THREAD_ID || '10' }}
          # 🔴 БЕЗ ТОЗИ КЛЮЧ ОЦЕНИТЕЛЯТ ПАДА НА ТЕСТ-КЛЮЧА „123" и вижда 1-3
          # записа вместо целия ден. Точно през тази врата минаваха карти без
          # slug — виж дългото обяснение в score.yml.
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY || vars.SPORTSDB_KEY }}
        run: |
          python cyalost.py
          python scorer.py --selftest
          python scorer.py

      # ══════════════════════════════════════════════════════════════
      #  🧱 СТЕНИТЕ ДА НЕ ЧАКАТ КРОН, КОЙТО МОЖЕ ДА НЕ УДАРИ (13.08.2026)
      #
      #  hub.yml има крон в 06:30. На 13.08 GitHub го ПРОПУСНА напълно —
      #  нула пускания за целия ден. Кодът беше верен, часовникът не удари.
      #  Изводът е по-широк от хъба: всеки крон „веднъж на ден" има реален
      #  шанс изобщо да не тръгне.
      #
      #  steni.py решава БЕЗ НИТО ЕДНА МРЕЖОВА ЗАЯВКА: сравнява текущите
      #  текстове с това, което hub_state.json казва, че вече стои в стаите.
      #  Съвпадат ли — не се пипа нищо и цената е няколко милисекунди.
      #  Различават ли се — тогава и само тогава тръгва setup_hub в режим
      #  rooms, а той сам опреснява само сменените, НА МЯСТО.
      - name: Стените искат ли опресняване
        id: steni
        run: python steni.py

      - name: Опресни стените
        if: steps.steni.outputs.nuzhno == '1'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID || '-1004426592150' }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || '-1004403334702' }}
          SUPPORT: ${{ vars.SUPPORT || '@green_picks_info_bot' }}
          GROUP_LINK: "${{ vars.GROUP_LINK || 'https://t.me/+_oYsaYaVKU80Yjc0' }}"
          # rooms, не all: каналът има свой ритъм и не се пипа оттук.
          HUB_MODE: rooms
        run: |
          python setup_hub.py --selftest
          python setup_hub.py

      # Рънът е на всеки 10 мин и се засича с другите state-комитъри,
      # затова push-ът е с rebase-retry цикъл, не гол опит.
      - name: Save state
        if: always()
        run: |
          git config user.name "greenpicks-bot"
          git config user.email "bot@greenpicks"
          # predict_state.json и predict_log.json СА ЧАСТ ОТ ТОВА: без тях
          # будилникът мери стария час и ще буди пак след 10 минути.
          # 🔴 ЕДИН ПО ЕДИН, НЕ НАВЕДНЪЖ (12.08.2026).
          # `git add a b nyama.json` НЕ добавя нищо — git отхвърля целия
          # pathspec, щом един файл липсва, а `|| true` крие изход 128.
          # Проверено в истинско repo: stage-нато остава ПРАЗНО.
          # budilnik_state.json още не съществува в хранилището, тоест всеки
          # рън, в който будилникът не буди, мълчаливо губеше offset-а на
          # Telegram, тефтера на предсказателя И дневника — и излизаше ЗЕЛЕН.
          for f in router_state.json support_state.json predict_state.json                    predict_log.json budilnik_state.json hub_state.json predict_log_arhiv.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Състоянието е без промяна — няма какво да се връща."
            exit 0
          fi
          git commit -m "router state"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then
              pushed=1
              break
            fi
            echo "Push-ът не мина (опит $i) — дърпам и опитвам пак."
            git pull --rebase --autostash || git rebase --abort || true
            sleep $((RANDOM % 6 + 3))
          done
          if [ "$pushed" != "1" ]; then
            echo "ЧЕРВЕНО: router_state.json НЕ се върна в repo-то — възможни дубли."
            exit 1
          fi
          echo "Състоянието е запазено."
